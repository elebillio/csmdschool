<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"/>
<title>Attendance Report | Monthly Student Report</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  * { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    height: 100%; 
    margin: 0; 
    padding: 0; 
    background: #f0f4f8;
  }
  body { 
    padding: 0; 
    margin: 0; 
    display: flex;
    flex-direction: column;
  }
  .app-container { 
    max-width: 100%;
    margin: 0 auto; 
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0;
  }
  
  .detail-header { 
    background: linear-gradient(135deg, #1e3c72, #2a5298); 
    padding: 8px 12px; 
    color: white; 
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    border-radius: 12px 12px 0 0;
    flex-shrink: 0;
  }
  .back-btn { 
    background: rgba(255,255,255,0.2); 
    border: none; 
    border-radius: 20px; 
    padding: 4px 10px; 
    color: white; 
    font-size: 0.65rem; 
    cursor: pointer; 
    display: inline-flex; 
    align-items: center; 
    gap: 4px;
  }
  .back-btn:hover { background: rgba(255,255,255,0.3); }
  
  .report-card {
    background: white;
    border-radius: 0 0 12px 12px;
    padding: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  .filter-section {
    background: #f8fafc;
    border-radius: 10px;
    padding: 6px;
    margin-bottom: 6px;
    border: 1px solid #e2e8f0;
    flex-shrink: 0;
  }
  
  .filter-section .row {
    margin: 0 -3px;
  }
  .filter-section .col-md-2, .filter-section .col-md-3 {
    padding: 0 3px;
  }
  .filter-section .form-label {
    margin-bottom: 2px;
    font-size: 0.6rem;
  }
  .filter-section .form-select-sm, .filter-section .btn-sm {
    font-size: 0.65rem;
    padding: 3px 6px;
  }
  
  .info-note {
    background: #e0f2fe;
    border-left: 3px solid #0284c7;
    padding: 4px 6px;
    border-radius: 8px;
    font-size: 0.55rem;
    color: #0369a1;
    margin-top: 4px;
  }
  
  .report-table-wrapper {
    overflow-x: auto;
    overflow-y: auto;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    background: white;
    flex: 1;
    min-height: 0;
    width: 100%;
  }
  
  .report-table {
    width: max-content;
    min-width: 100%;
    border-collapse: collapse;
    font-size: 0.6rem;
    table-layout: auto;
  }
  
  .report-table th {
    background: #f1f5f9;
    padding: 5px 3px;
    text-align: center;
    font-weight: 600;
    color: #1e293b;
    border-bottom: 1px solid #e2e8f0;
    position: sticky;
    top: 0;
    z-index: 10;
    font-size: 0.55rem;
    white-space: nowrap;
  }
  
  .report-table td {
    padding: 3px 2px;
    text-align: center;
    border-bottom: 1px solid #eef2f8;
    vertical-align: middle;
    white-space: nowrap;
    font-size: 0.55rem;
  }
  
  .student-name-cell {
    text-align: left;
    font-weight: 600;
    background: white;
    position: sticky;
    left: 0;
    z-index: 5;
    min-width: 85px;
    white-space: nowrap;
  }
  
  .admission-cell {
    min-width: 55px;
    white-space: nowrap;
  }
  
  .present, .absent, .sick-leave, .casual-leave, .short-leave, .long-leave, .meeting, .holiday, .not-marked, .not-applicable {
    border-radius: 20px;
    padding: 2px 0;
    display: inline-block;
    width: 20px;
    font-size: 0.5rem;
    font-weight: 600;
  }
  .present { background: #d1fae5; color: #065f46; }
  .absent { background: #fee2e2; color: #991b1b; }
  .sick-leave { background: #fed7aa; color: #9a3412; }
  .casual-leave { background: #ede9fe; color: #5b21b6; }
  .short-leave { background: #fce7f3; color: #be185d; }
  .long-leave { background: #f3f4f6; color: #374151; }
  .meeting { background: #dbeafe; color: #1e40af; }
  .holiday { background: #cffafe; color: #155e75; }
  .not-marked { background: #f1f5f9; color: #94a3b8; }
  .not-applicable { background: #e2e8f0; color: #64748b; }
  
  .summary-card {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    border-radius: 10px;
    padding: 5px 8px;
    margin-bottom: 6px;
    color: white;
    flex-shrink: 0;
  }
  
  .summary-stats {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .stat-badge {
    background: rgba(255,255,255,0.2);
    border-radius: 25px;
    padding: 2px 6px;
    text-align: center;
  }
  
  .stat-badge h4 { margin: 0; font-size: 0.75rem; font-weight: 700; }
  .stat-badge p { margin: 0; font-size: 0.4rem; opacity: 0.8; }
  
  /* Footer Summary Styles */
  .footer-summary {
    background: #f8fafc;
    border-top: 2px solid #1e3c72;
    padding: 8px 10px;
    margin-top: 8px;
    border-radius: 8px;
    font-size: 0.55rem;
    flex-shrink: 0;
  }
  .footer-summary-title {
    font-weight: 700;
    color: #1e3c72;
    margin-bottom: 5px;
    font-size: 0.6rem;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 3px;
  }
  .daily-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .day-item {
    flex: 1;
    min-width: 35px;
    text-align: center;
    padding: 3px;
    background: white;
    border-radius: 5px;
    border: 1px solid #e2e8f0;
  }
  .day-number {
    font-weight: 700;
    color: #1e3c72;
    font-size: 0.5rem;
  }
  .day-present {
    color: #10b981;
    font-weight: 600;
    font-size: 0.5rem;
  }
  .day-absent {
    color: #ef4444;
    font-weight: 600;
    font-size: 0.5rem;
  }
  .day-leave {
    color: #f59e0b;
    font-weight: 600;
    font-size: 0.5rem;
  }
  .total-summary {
    display: flex;
    justify-content: space-between;
    padding-top: 6px;
    border-top: 1px solid #e2e8f0;
    font-weight: 700;
  }
  .total-label {
    color: #1e3c72;
  }
  .total-present {
    color: #10b981;
  }
  .total-absent {
    color: #ef4444;
  }
  .total-leave {
    color: #f59e0b;
  }
  .total-rate {
    color: #1e3c72;
  }
  
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px solid #e2e8f0;
    flex-shrink: 0;
  }
  .legend-item { display: flex; align-items: center; gap: 2px; font-size: 0.5rem; }
  .legend-color { width: 10px; height: 10px; border-radius: 20px; }
  
  .print-btn, .export-btn, .pdf-btn {
    border-radius: 25px;
    padding: 3px 8px;
    font-size: 0.6rem;
    cursor: pointer;
    border: none;
  }
  .print-btn { background: #475569; color: white; }
  .print-btn:hover { background: #334155; }
  .export-btn { background: #10b981; color: white; }
  .export-btn:hover { background: #059669; }
  .pdf-btn { background: #ef4444; color: white; }
  .pdf-btn:hover { background: #dc2626; }
  
  .loading-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #e2e8f0; border-top-color: #1e3c72; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .pdf-loading {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    visibility: hidden;
    opacity: 0;
    transition: 0.2s;
  }
  .pdf-loading.show {
    visibility: visible;
    opacity: 1;
  }
  .pdf-loading-content {
    background: white;
    padding: 15px 25px;
    border-radius: 15px;
    text-align: center;
  }
  .pdf-spinner {
    width: 30px;
    height: 30px;
    border: 3px solid #e2e8f0;
    border-top-color: #1e3c72;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 8px;
  }
  
  @media print {
    body { background: white; padding: 0; margin: 0; }
    .back-btn, .print-btn, .export-btn, .pdf-btn, .filter-section button, .filter-section select, .filter-section .form-label, .info-note { display: none !important; }
    .report-card { padding: 0; margin: 0; box-shadow: none; }
    .filter-section { display: none !important; }
    .report-table-wrapper { overflow: visible !important; }
    .report-table { width: 100%; table-layout: auto; }
    .report-table th, .report-table td { border: 1px solid #ddd; }
    .present, .absent, .sick-leave, .casual-leave, .short-leave, .long-leave, .meeting, .holiday, .not-marked, .not-applicable, .footer-summary {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="detail-header">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div style="text-align: center; flex: 1;">
      <div style="font-size: 0.7rem; font-weight: bold;">🏫 THE LEADS HIGH SCHOOL (DINGA)</div>
      <div style="font-size: 0.55rem; opacity: 0.8;">Attendance Report</div>
    </div>
    <div>
      <button class="print-btn me-1" onclick="window.print()">🖨️ Print</button>
      <button class="pdf-btn me-1" onclick="exportToPDF()">📄 PDF</button>
      <button class="export-btn" onclick="exportToExcel()">📎 Export</button>
    </div>
  </div>
  
  <div class="report-card">
    <div class="filter-section">
      <div class="row g-1 align-items-end">
        <div class="col-md-3">
          <label class="form-label fw-bold">Class</label>
          <select id="classSelect" class="form-select form-select-sm">
            <option value="">-- Select --</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-bold">Month</label>
          <select id="monthSelect" class="form-select form-select-sm">
            <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
            <option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option>
            <option value="6">Jul</option><option value="7">Aug</option><option value="8">Sep</option>
            <option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-bold">Year</label>
          <select id="yearSelect" class="form-select form-select-sm">
            <option value="2024">2024</option><option value="2025" selected>2025</option>
            <option value="2026">2026</option><option value="2027">2027</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary btn-sm w-100" id="loadReportBtn">🔍 Generate</button>
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-secondary btn-sm w-100" id="resetBtn">⟳ Reset</button>
        </div>
      </div>
      <div class="info-note">
        ℹ️ Students shown after admission date. Days before admission show "—".
      </div>
    </div>
    
    <div class="summary-card" id="summaryCard" style="display: none;">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
        <h6 class="mb-0" id="reportTitle" style="font-size: 0.65rem;">Attendance Report</h6>
        <div class="summary-stats" id="summaryStats"></div>
      </div>
    </div>
    
    <div id="reportTableContainer" class="report-table-wrapper">
      <div class="text-center py-2">
        <div style="font-size: 1.5rem;">📅</div>
        <p class="text-muted mt-1" style="font-size: 0.65rem;">Select class, month, year and click Generate</p>
      </div>
    </div>
    
    <!-- Footer Summary -->
    <div id="footerSummary" class="footer-summary" style="display: none;">
      <div class="footer-summary-title">📊 Daily Summary</div>
      <div id="dailySummaryContainer" class="daily-summary"></div>
      <div class="total-summary">
        <span class="total-label">📌 TOTAL:</span>
        <span class="total-present" id="footerTotalPresent">P: 0</span>
        <span class="total-absent" id="footerTotalAbsent">A: 0</span>
        <span class="total-leave" id="footerTotalLeave">L: 0</span>
        <span class="total-rate" id="footerTotalRate">0%</span>
      </div>
    </div>
    
    <div class="legend">
      <div class="legend-item"><div class="legend-color present"></div><span>P</span></div>
      <div class="legend-item"><div class="legend-color absent"></div><span>A</span></div>
      <div class="legend-item"><div class="legend-color sick-leave"></div><span>SL</span></div>
      <div class="legend-item"><div class="legend-color casual-leave"></div><span>CL</span></div>
      <div class="legend-item"><div class="legend-color short-leave"></div><span>SH</span></div>
      <div class="legend-item"><div class="legend-color long-leave"></div><span>LL</span></div>
      <div class="legend-item"><div class="legend-color meeting"></div><span>M</span></div>
      <div class="legend-item"><div class="legend-color holiday"></div><span>H</span></div>
      <div class="legend-item"><div class="legend-color not-marked"></div><span>—</span></div>
      <div class="legend-item"><div class="legend-color not-applicable"></div><span>NA</span></div>
    </div>
  </div>
</div>

<div id="pdfLoading" class="pdf-loading">
  <div class="pdf-loading-content">
    <div class="pdf-spinner"></div>
    <p>Generating PDF...</p>
    <small>Please wait</small>
  </div>
</div>

<script>
const supabaseUrl = "https://tqcfcztyvmedmuhohpps.supabase.co";
const supabaseKey = "sb_publishable_mnk4CySLaCI-FwtKJ9DhMg_z852ATHH";
const supabase1 = window.supabase.createClient(supabaseUrl, supabaseKey);

let allClasses = [];

const statusConfig = {
    1: { name: 'P', fullName: 'Present', class: 'present' },
    2: { name: 'A', fullName: 'Absent', class: 'absent' },
    3: { name: 'SL', fullName: 'Sick Leave', class: 'sick-leave' },
    4: { name: 'CL', fullName: 'Casual Leave', class: 'casual-leave' },
    5: { name: 'SH', fullName: 'Short Leave', class: 'short-leave' },
    6: { name: 'LL', fullName: 'Long Leave', class: 'long-leave' },
    7: { name: 'M', fullName: 'Meeting', class: 'meeting' },
    8: { name: 'H', fullName: 'Holiday', class: 'holiday' }
};

function getStatusClass(statusId) { return statusConfig[statusId]?.class || 'not-marked'; }
function getStatusShortName(statusId) { return statusConfig[statusId]?.name || '—'; }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }

function goBack() {
    if (window.parent && window.parent !== window) {
        try {
            if (typeof window.parent.closeIframe === 'function') window.parent.closeIframe();
            else window.parent.location.href = 'attendance.html';
        } catch(e) { window.location.href = 'attendance.html'; }
    } else { window.location.href = 'attendance.html'; }
}

async function loadClasses() {
    const { data, error } = await supabase1.from("class_rooms").select("*").order("class_room_serial");
    if (error) return;
    allClasses = data || [];
    const classSelect = document.getElementById('classSelect');
    classSelect.innerHTML = '<option value="">-- Select --</option>';
    for (const cls of allClasses) {
        classSelect.innerHTML += `<option value="${cls.class_room_id}">${cls.class_room_no}</option>`;
    }
}

async function loadStudentsByClass(classId) {
    const { data, error } = await supabase1
        .from("students")
        .select("*")
        .eq("stu_class_room_id", classId)
        .order("stu_name");
    if (error) return [];
    return data || [];
}

async function loadAttendanceForMonth(classId, year, month) {
    const startDate = `${year}-${String(month + 1).padStart(2, '0')}-01`;
    const lastDay = new Date(year, month + 1, 0);
    const endDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(lastDay.getDate()).padStart(2, '0')}`;
    
    const { data, error } = await supabase1
        .from("students_attendence")
        .select("*")
        .gte("stu_attendence_date", startDate)
        .lte("stu_attendence_date", endDate);
    if (error) return [];
    return data || [];
}

function getDaysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }

async function generateReport() {
    const classId = document.getElementById('classSelect').value;
    const month = parseInt(document.getElementById('monthSelect').value);
    const year = parseInt(document.getElementById('yearSelect').value);
    
    if (!classId) { alert("Select class"); return; }
    
    const container = document.getElementById('reportTableContainer');
    container.innerHTML = '<div class="text-center py-2"><div class="loading-spinner"></div><p>Loading...</p></div>';
    
    try {
        const students = await loadStudentsByClass(parseInt(classId));
        const attendance = await loadAttendanceForMonth(parseInt(classId), year, month);
        
        if (students.length === 0) {
            container.innerHTML = '<div class="text-center py-2 text-muted"><div style="font-size:1.5rem;">👥</div><p>No students</p></div>';
            document.getElementById('footerSummary').style.display = 'none';
            return;
        }
        
        const daysInMonth = getDaysInMonth(year, month);
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        
        const attendanceMap = new Map();
        for (const att of attendance) {
            const key = `${att.stu_id}_${att.stu_attendence_date}`;
            attendanceMap.set(key, att.stu_attendence_att_status_id);
        }
        
        let totalPresent = 0, totalAbsent = 0, totalLeave = 0, totalPossibleDays = 0;
        let dailyTotals = {};
        
        for (let d = 1; d <= daysInMonth; d++) {
            dailyTotals[d] = { present: 0, absent: 0, leave: 0 };
        }
        
        let html = `<table class="report-table" id="attendanceReportTable"><thead><tr>
            <th class="student-name-cell">Student</th>
            <th class="admission-cell">Adm No</th>`;
        
        for (let d = 1; d <= daysInMonth; d++) {
            html += `<th style="min-width: 28px;">${d}</th>`;
        }
        
        html += `<th>P</th><th>A</th><th>L</th><th>%</th>`;
        html += `</thead><tbody>`;
        
        for (const student of students) {
            let present = 0, absent = 0, leave = 0, possibleDays = 0;
            const admissionDate = student.stu_admission_date ? new Date(student.stu_admission_date) : null;
            
            let shortName = student.stu_name;
            if (shortName && shortName.length > 12) {
                shortName = shortName.substring(0, 10) + '..';
            }
            
            html += `<tr>
                <td class="student-name-cell" title="${escapeHtml(student.stu_name)}"><strong>${escapeHtml(shortName)}</strong><br><span style="font-size:0.5rem;color:#64748b;">${escapeHtml(student.stu_admission_no)}</span><\/td>
                <td class="admission-cell">${escapeHtml(student.stu_admission_no) || '—'}<\/td>`;
            
            for (let d = 1; d <= daysInMonth; d++) {
                const currentDate = new Date(year, month, d);
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const key = `${student.stu_id}_${dateStr}`;
                const statusId = attendanceMap.get(key);
                
                let isAdmitted = true;
                if (admissionDate && currentDate < admissionDate) isAdmitted = false;
                
                if (!isAdmitted) {
                    html += `<td><span class="not-applicable">—</span></td>`;
                } else {
                    possibleDays++;
                    const statusClass = getStatusClass(statusId);
                    const shortNameStatus = getStatusShortName(statusId);
                    if (statusId === 1) {
                        present++;
                        dailyTotals[d].present++;
                    } else if (statusId === 2) {
                        absent++;
                        dailyTotals[d].absent++;
                    } else if (statusId >= 3 && statusId <= 8) {
                        leave++;
                        dailyTotals[d].leave++;
                    }
                    html += `<td><span class="${statusClass}" title="${statusConfig[statusId]?.fullName || 'Not Marked'}">${shortNameStatus}</span></td>`;
                }
            }
            
            const percentage = possibleDays > 0 ? Math.round((present / possibleDays) * 100) : 0;
            totalPresent += present; totalAbsent += absent; totalLeave += leave; totalPossibleDays += possibleDays;
            
            html += `<td style="font-weight:bold;color:#10b981;">${present}<\/td>
                     <td style="font-weight:bold;color:#ef4444;">${absent}<\/td>
                     <td style="font-weight:bold;color:#f59e0b;">${leave}<\/td>
                     <td style="font-weight:bold;">${percentage}%<\/td>
                    <\/tr>`;
        }
        
        html += `</tbody></table>`;
        container.innerHTML = html;
        
        const overallPercentage = totalPossibleDays > 0 ? Math.round((totalPresent / totalPossibleDays) * 100) : 0;
        const classObj = allClasses.find(c => c.class_room_id == classId);
        const className = classObj ? classObj.class_room_no : 'Class';
        
        document.getElementById('reportTitle').innerHTML = `${className} | ${monthNames[month]} ${year}`;
        document.getElementById('summaryStats').innerHTML = `
            <div class="stat-badge"><h4>${students.length}</h4><p>Std</p></div>
            <div class="stat-badge"><h4>${daysInMonth}</h4><p>Days</p></div>
            <div class="stat-badge"><h4>${totalPresent}</h4><p>P</p></div>
            <div class="stat-badge"><h4>${totalAbsent}</h4><p>A</p></div>
            <div class="stat-badge"><h4>${totalLeave}</h4><p>L</p></div>
            <div class="stat-badge"><h4>${overallPercentage}%</h4><p>%</p></div>
        `;
        document.getElementById('summaryCard').style.display = 'block';
        
        // Update Daily Footer Summary
        let dailyHtml = '';
        for (let d = 1; d <= daysInMonth; d++) {
            const present = dailyTotals[d].present;
            const absent = dailyTotals[d].absent;
            const leave = dailyTotals[d].leave;
            dailyHtml += `
                <div class="day-item">
                    <div class="day-number">${d}</div>
                    <div class="day-present">P:${present}</div>
                    <div class="day-absent">A:${absent}</div>
                    <div class="day-leave">L:${leave}</div>
                </div>
            `;
        }
        document.getElementById('dailySummaryContainer').innerHTML = dailyHtml;
        document.getElementById('footerTotalPresent').innerHTML = `P: ${totalPresent}`;
        document.getElementById('footerTotalAbsent').innerHTML = `A: ${totalAbsent}`;
        document.getElementById('footerTotalLeave').innerHTML = `L: ${totalLeave}`;
        document.getElementById('footerTotalRate').innerHTML = `${overallPercentage}%`;
        document.getElementById('footerSummary').style.display = 'block';
        
    } catch (error) {
        console.error(error);
        container.innerHTML = '<div class="text-center py-2 text-danger"><div style="font-size:1.5rem;">❌</div><p>Error</p></div>';
        document.getElementById('footerSummary').style.display = 'none';
    }
}

function resetFilters() {
    document.getElementById('classSelect').value = '';
    document.getElementById('monthSelect').value = new Date().getMonth().toString();
    document.getElementById('yearSelect').value = new Date().getFullYear().toString();
    document.getElementById('reportTableContainer').innerHTML = `
        <div class="text-center py-2">
            <div style="font-size: 1.5rem;">📅</div>
            <p class="text-muted mt-1" style="font-size:0.65rem;">Select class, month, year</p>
        </div>
    `;
    document.getElementById('summaryCard').style.display = 'none';
    document.getElementById('footerSummary').style.display = 'none';
}

function exportToExcel() {
    const table = document.querySelector('.report-table');
    if (!table) { alert("Generate report first"); return; }
    
    let csv = [];
    const rows = table.querySelectorAll('tr');
    for (const row of rows) {
        const rowData = [];
        const cols = row.querySelectorAll('th, td');
        for (const col of cols) {
            let text = col.innerText.replace(/\n/g, ' ').replace(/,/g, ';');
            rowData.push(text);
        }
        csv.push(rowData.join(','));
    }
    
    const blob = new Blob(["\uFEFF" + csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `attendance_report.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

function exportToPDF() {
    const element = document.querySelector('.report-card');
    if (!element) { alert("Generate report first"); return; }
    
    const loadingOverlay = document.getElementById('pdfLoading');
    loadingOverlay.classList.add('show');
    
    const classObj = allClasses.find(c => c.class_room_id == document.getElementById('classSelect').value);
    const className = classObj ? classObj.class_room_no : 'Class';
    const month = parseInt(document.getElementById('monthSelect').value);
    const year = parseInt(document.getElementById('yearSelect').value);
    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const now = new Date();
    const dateStr = now.toLocaleString();
    
    // Create a new div for PDF content with header
    const pdfContent = document.createElement('div');
    pdfContent.style.padding = '5px';
    pdfContent.style.backgroundColor = 'white';
    pdfContent.style.fontFamily = 'Arial, sans-serif';
    
    // Add header (school name)
    pdfContent.innerHTML = `
        <div style="text-align: center; padding: 8px; background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border-radius: 8px; margin-bottom: 8px;">
            <div style="font-size: 12px; font-weight: bold;">🏫 THE LEADS HIGH SCHOOL (DINGA)</div>
            <div style="font-size: 10px; opacity: 0.9; margin-top: 2px;">Attendance Report | ${className} | ${monthNames[month]} ${year}</div>
            <div style="font-size: 8px; opacity: 0.7; margin-top: 2px;">Generated on: ${dateStr}</div>
        </div>
    `;
    
    // Clone the element content (without buttons, selects, labels)
    const cloneElement = element.cloneNode(true);
    
    // Remove filter section (buttons, selects, labels)
    const filterSection = cloneElement.querySelector('.filter-section');
    if (filterSection) filterSection.remove();
    
    // Remove legend from clone (will add separately)
    const legendClone = cloneElement.querySelector('.legend');
    let legendHtml = '';
    if (legendClone) {
        legendHtml = `<div style="display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 8px; padding-top: 5px; border-top: 1px solid #e2e8f0;">
            ${legendClone.innerHTML}
        </div>`;
        legendClone.remove();
    }
    
    pdfContent.appendChild(cloneElement);
    if (legendHtml) pdfContent.innerHTML += legendHtml;
    
    const opt = {
        margin: [0.1, 0.1, 0.1, 0.05],
        filename: `attendance_report_${className}_${monthNames[month]}_${year}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: false, logging: false, allowTaint: true },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
    };
    
    setTimeout(() => {
        html2pdf().set(opt).from(pdfContent).save().then(() => {
            loadingOverlay.classList.remove('show');
        }).catch(err => {
            console.error("PDF Error:", err);
            loadingOverlay.classList.remove('show');
            alert("PDF failed. Please use Print button.");
        });
    }, 100);
}

document.getElementById('loadReportBtn')?.addEventListener('click', generateReport);
document.getElementById('resetBtn')?.addEventListener('click', resetFilters);

async function init() {
    await loadClasses();
    const now = new Date();
    document.getElementById('monthSelect').value = now.getMonth();
    document.getElementById('yearSelect').value = now.getFullYear();
}

init();

window.goBack = goBack;
window.exportToExcel = exportToExcel;
window.exportToPDF = exportToPDF;
</script>
