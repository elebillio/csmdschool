// ======================= WHATSAPP SHARE FUNCTIONS =======================
function isValidWhatsAppNumber(mobile) {
  if(!mobile || mobile === 'No mobile' || mobile === '') return false;
  let clean = mobile.replace(/[\s\-]/g, '');
  if(clean.length >= 10 && clean.length <= 13) {
    if(clean.match(/^(03|3|92)\d{9,10}$/)) return true;
  }
  return false;
}

function cleanMobileNumber(mobile) {
  let clean = mobile.replace(/[\s\-]/g, '');
  if (clean.startsWith('0')) clean = clean.substring(1);
  if (!clean.startsWith('92')) clean = '92' + clean;
  return clean;
}

function shareViaWhatsApp(mobile, message) {
  const cleanMobile = cleanMobileNumber(mobile);
  const encodedMessage = encodeURIComponent(message);
  const whatsappUrl = `https://wa.me/${cleanMobile}?text=${encodedMessage}`;
  
  if (window.Android && window.Android.shareToWhatsApp) {
    window.Android.shareToWhatsApp(cleanMobile, message);
    showToast("Opening WhatsApp...");
  } else {
    window.location.href = whatsappUrl;
  }
}

// AUTO GENERATE RECEIPT ID: AFR-000001, AFR-000002...
// =====================================================
async function getNextReceiptId() {
    try {
        const { data, error } = await supabase1
            .from("student_pay_scale")
            .select("stu_receipt")
            .order("stu_receipt", { ascending: true });
        
        if (error) {
            console.error("Error fetching receipts:", error);
            return "AFR-000001";
        }
        
        let maxNumber = 0;
        const prefix = "AFR";
        
        if (data && data.length > 0) {
            for (const record of data) {
                const id = record.stu_receipt;
                if (id && id.startsWith(prefix + "-")) {
                    const numericPart = id.substring(prefix.length + 1);
                    const num = parseInt(numericPart, 10);
                    if (!isNaN(num) && num > maxNumber) {
                        maxNumber = num;
                    }
                }
            }
        }
        
        const nextNumber = maxNumber + 1;
        const newId = `${prefix}-${nextNumber.toString().padStart(6, '0')}`;
        return newId;
        
    } catch (err) {
        console.error("Error in getNextReceiptId:", err);
        return "AFR-000001";
    }
}

async function loadAllData() {
    await loadClassrooms();

async function loadClassrooms() {
    const { data, error } = await supabase1.from("class_rooms").select("*").order("class_room_no", { ascending: true });
    if (!error && data) {
        allClassrooms = data;
    }
    return allClassrooms;
}

async function loadStudents() {
    const { data, error } = await supabase1.from("students").select("*").order("stu_name", { ascending: true });
    if (!error && data) {
        allStudents = data;
    }
    return allStudents;
}

async function loadFees() {
    const { data, error } = await supabase1.from("student_pay_scale").select("*").order("stu_pay_id", { ascending: false });
    if (!error && data) {
        allFees = data;
        renderFeeList();
        populateFilters();
    }
    return allFees;
}

function populateFilters() {
    const years = [...new Set(allFees.map(f => f.stu_issu_date ? new Date(f.stu_issu_date).getFullYear() : null).filter(y => y))];
    const yearSelect = document.getElementById('yearFilter');
    if(yearSelect) {
        yearSelect.innerHTML = '<option value="all">All Years</option>';
        years.sort().reverse().forEach(y => { yearSelect.innerHTML += `<option value="${y}">${y}</option>`; });
    }
    
    const sessions = [...new Set(allFees.map(f => f.session_id).filter(s => s))];
    const sessionSelect = document.getElementById('sessionFilter');
    if(sessionSelect) {
        sessionSelect.innerHTML = '<option value="all">All Sessions</option>';
        sessions.sort().forEach(s => { sessionSelect.innerHTML += `<option value="${s}">Session ${s}</option>`; });
    }
}

    const header = document.getElementById(`group-header-${groupKey.replace(/[^a-zA-Z0-9]/g, '_')}`);
    if (content) {
        if (content.classList.contains('collapsed')) {
            content.classList.remove('collapsed');
            header?.classList.remove('collapsed');
            groupStates[groupKey] = true;
        } else {
            content.classList.add('collapsed');
            header?.classList.add('collapsed');
            groupStates[groupKey] = false;
        }
    }
}

function renderFeeList() {
    const container = document.getElementById('feeListContainer');
    if(!container) return;
    
    let filtered = [...allFees];
    
    const searchTerm = document.getElementById('feeSearchInput')?.value.toLowerCase() || '';
    const sessionFilter = document.getElementById('sessionFilter')?.value;
    const yearFilter = document.getElementById('yearFilter')?.value;
    const monthFilter = document.getElementById('monthFilter')?.value;
    const groupBy = document.getElementById('groupBySelect')?.value || 'month';
    
    if (searchTerm) {
        filtered = filtered.filter(f => {
            const student = allStudents.find(s => s.stu_id === f.stu_id);
            return (student?.stu_name?.toLowerCase().includes(searchTerm)) ||
                   (f.stu_invoice?.toLowerCase().includes(searchTerm));
        });
    }
    if (sessionFilter && sessionFilter !== 'all') filtered = filtered.filter(f => f.session_id == sessionFilter);
    if (yearFilter && yearFilter !== 'all') filtered = filtered.filter(f => f.stu_issu_date && new Date(f.stu_issu_date).getFullYear() == yearFilter);
    if (monthFilter && monthFilter !== 'all') filtered = filtered.filter(f => f.stu_issu_date && new Date(f.stu_issu_date).getMonth() + 1 == monthFilter);
    
    if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="bi bi-receipt fs-3"></i><p>No fee records found</p></div>`;
        return;
    }
    
    let groupedData = {};
    
    if (groupBy === 'month') {
        filtered.forEach(f => {
            const date = f.stu_issu_date ? new Date(f.stu_issu_date) : null;
            const key = date ? `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')} - ${date.toLocaleString('default', { month: 'long' })} ${date.getFullYear()}` : 'No Date';
            if (!groupedData[key]) groupedData[key] = [];
            groupedData[key].push(f);
        });
    } else if (groupBy === 'session') {
        filtered.forEach(f => {
            const key = f.session_id ? `Session ${f.session_id}` : 'No Session';
            if (!groupedData[key]) groupedData[key] = [];
            groupedData[key].push(f);
        });
    } else if (groupBy === 'classroom') {
        filtered.forEach(f => {
            const student = allStudents.find(s => s.stu_id === f.stu_id);
            const classroomId = student?.stu_class_room_id;
            const key = getClassroomName(classroomId);
            if (!groupedData[key]) groupedData[key] = [];
            groupedData[key].push(f);
        });
    } else {
        groupedData['All Records'] = filtered;
    }
    
    let sortedKeys = Object.keys(groupedData);
    if (groupBy === 'month') {
        sortedKeys.sort().reverse();
    } else if (groupBy === 'classroom') {
        sortedKeys.sort();
    }
    
    let html = "";
    for (const groupKey of sortedKeys) {
        const fees = groupedData[groupKey];
        const groupTotal = fees.reduce((sum, f) => sum + (Number(f.stu_paid) || 0), 0);
        const safeKey = groupKey.replace(/[^a-zA-Z0-9]/g, '_');
        const isExpanded = groupStates[groupKey] !== undefined ? groupStates[groupKey] : false;
        
        html += `<div class="group-header ${isExpanded ? '' : 'collapsed'}" id="group-header-${safeKey}" onclick="toggleGroup('${groupKey.replace(/'/g, "\\'")}')">
            <span><i class="bi bi-folder2-open me-2"></i> ${groupKey}</span>
            <div>
                <span class="badge bg-primary rounded-pill me-2">${fees.length} records</span>
                <span class="badge bg-success rounded-pill">PKR ${groupTotal.toLocaleString()}</span>
                <i class="bi bi-chevron-down toggle-icon ms-2"></i>
            </div>
        </div>`;
        
        html += `<div class="group-content ${isExpanded ? '' : 'collapsed'}" id="group-content-${safeKey}">`;
        for (const f of fees) {
            const student = allStudents.find(s => s.stu_id === f.stu_id);
            const paid = Number(f.stu_paid) || 0;
            const due = Number(f.stu_due) || 0;
            const status = due === 0 ? 'Paid' : (paid > 0 ? 'Partial' : 'Unpaid');
            const statusClass = due === 0 ? 'fee-status-paid' : 'fee-status-due';
            html += `<div class="fee-card" data-id="${f.stu_pay_id}">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <strong>${escapeHtml(student?.stu_name || 'Unknown')}</strong>
                        <br><small class="text-muted">${f.stu_invoice || 'No Invoice'} | ${getClassroomName(student?.stu_class_room_id)}</small>
                        <br><small class="text-muted">Fee ID: ${f.stu_pay_id} | Receipt: ${f.stu_receipt || 'Not issued'}</small>
                    </div>
                    <div class="text-end">
                        <div class="fee-amount">PKR ${paid.toLocaleString()}</div>
                        <small class="${statusClass}">${status}</small>
                    </div>
                </div>
                <div class="mt-2 small text-muted">
                    Date: ${f.stu_pay_date || f.stu_issu_date || '—'} | 
                    Due: PKR ${due.toLocaleString()} | 
                    Session: ${f.session_id || '—'}
                </div>
            </div>`;
        }
        html += `</div>`;
    }
    container.innerHTML = html;
    
    document.querySelectorAll("#feeListContainer .fee-card").forEach(el => {
        el.addEventListener("click", (e) => {
            e.stopPropagation();
            const feeId = el.dataset.id;
            const fee = allFees.find(f => f.stu_pay_id === feeId);
            if (fee) showFeeDetail(fee);
        });
    });
}

function showFeeDetail(fee) {
    currentFee = fee;
    const student = allStudents.find(s => s.stu_id === fee.stu_id);
    document.getElementById("feeDetailStudent").innerText = student?.stu_name || 'Unknown';
    document.getElementById("feeDetailInvoice").innerHTML = `Fee ID: ${fee.stu_pay_id} | Invoice: ${fee.stu_invoice || '—'} | Receipt: ${fee.stu_receipt || 'Not issued'}`;
    
    const paid = Number(fee.stu_paid) || 0;
    const due = Number(fee.stu_due) || 0;
    const status = due === 0 ? 'Paid' : (paid > 0 ? 'Partial' : 'Unpaid');
    const statusBadge = due === 0 ? 'bg-success' : (paid > 0 ? 'bg-warning' : 'bg-danger');
    
    document.getElementById("feeDetailInfo").innerHTML = `
        <div class="info-row"><div class="info-label">Fee ID</div><div class="info-value"><code>${fee.stu_pay_id}</code></div></div>
        <div class="info-row"><div class="info-label">Receipt No</div><div class="info-value"><code>${fee.stu_receipt || 'Not issued'}</code></div></div>
        <div class="info-row"><div class="info-label">Issue Date</div><div class="info-value">${fee.stu_issu_date || '—'}</div></div>
        <div class="info-row"><div class="info-label">Payment Date</div><div class="info-value">${fee.stu_pay_date || '—'}</div></div>
        <div class="info-row"><div class="info-label">Session ID</div><div class="info-value">${fee.session_id || '—'}</div></div>
        <div class="info-row"><div class="info-label">Classroom</div><div class="info-value">${getClassroomName(student?.stu_class_room_id)}</div></div>
        <div class="info-row"><div class="info-label">Fee Fix</div><div class="info-value">PKR ${Number(fee.stu_fee_fix || 0).toLocaleString()}</div></div>
        <div class="info-row"><div class="info-label">Concession</div><div class="info-value">PKR ${Number(fee.stu_fee_con || 0).toLocaleString()}</div></div>
        <div class="info-row"><div class="info-label">Fee Scale</div><div class="info-value">PKR ${Number(fee.stu_fee_scale || 0).toLocaleString()}</div></div>
        <div class="info-row"><div class="info-label">Total Amount</div><div class="info-value fw-bold">PKR ${Number(fee.stu_total || 0).toLocaleString()}</div></div>
        <div class="info-row"><div class="info-label">Paid Amount</div><div class="info-value text-success fw-bold">PKR ${paid.toLocaleString()}</div></div>
        <div class="info-row"><div class="info-label">Due Amount</div><div class="info-value text-danger fw-bold">PKR ${due.toLocaleString()}</div></div>
        <div class="info-row"><div class="info-label">Status</div><div class="info-value"><span class="badge ${statusBadge}">${status}</span></div></div>
    `;
    
    document.getElementById('feeListContainer').parentElement.style.display = 'none';
    document.getElementById('feeDetailView').style.display = 'block';
}

function backToFeeList() {
    document.getElementById('feeDetailView').style.display = 'none';
    document.getElementById('feeListContainer').parentElement.style.display = 'block';
    renderFeeList();
}

async function deleteFeeRecord() {
    if (!currentFee) return;
    if (!confirm(`⚠️ Delete fee record ${currentFee.stu_pay_id} (Invoice: ${currentFee.stu_invoice}) permanently?`)) return;
    
    const { error } = await supabase1.from("student_pay_scale").delete().eq("stu_pay_id", currentFee.stu_pay_id);
    if (error) {
        alert("Delete failed: " + error.message);
        return;
    }
    alert("✅ Fee record deleted successfully!");
    backToFeeList();
    await loadFees();
}

function editFeeRecord() {
    if (!currentFee) return;
    const student = allStudents.find(s => s.stu_id === currentFee.stu_id);
    
    document.getElementById("edit_fee_id").value = currentFee.stu_pay_id;
    document.getElementById("edit_fee_id_display").value = currentFee.stu_pay_id;
    document.getElementById("edit_invoice").value = currentFee.stu_invoice || '';
    document.getElementById("edit_student_name").value = student?.stu_name || 'Unknown';
    document.getElementById("edit_total").value = Number(currentFee.stu_total || 0).toLocaleString();
    document.getElementById("edit_paid").value = currentFee.stu_paid || 0;
    document.getElementById("edit_pay_date").value = currentFee.stu_pay_date || '';
    
    getNextReceiptId().then(newReceipt => {
        document.getElementById("edit_receipt").value = newReceipt;
    });
    
    new bootstrap.Modal(document.getElementById("feeEditModal")).show();
}

async function updateFeePayment() {
    const feeId = document.getElementById("edit_fee_id").value;
    const paid = parseFloat(document.getElementById("edit_paid").value) || 0;
    const payDate = document.getElementById("edit_pay_date").value;
    const receipt = document.getElementById("edit_receipt").value;
    
    const currentFeeRec = allFees.find(f => f.stu_pay_id === feeId);
    if (!currentFeeRec) return;
    
    const total = Number(currentFeeRec.stu_total) || 0;
    const due = total - paid;
    
    const updateData = {
        stu_paid: paid,
        stu_due: due,
        stu_receipt: receipt,
        stu_fee_status_id: due === 0 ? 2 : 1
    };
    if (payDate) updateData.stu_pay_date = payDate;
    
    const { error } = await supabase1.from("student_pay_scale").update(updateData).eq("stu_pay_id", feeId);
    if (error) {
        alert("Update failed: " + error.message);
        return;
    }
    alert("✅ Payment updated successfully!");
    bootstrap.Modal.getInstance(document.getElementById("feeEditModal")).hide();
    await loadFees();
    if (currentFee) {
        const updatedFee = allFees.find(f => f.stu_pay_id === feeId);
        if (updatedFee) showFeeDetail(updatedFee);
    }
}

// ======================= EVENT BINDING =======================
document.getElementById('feeSearchInput')?.addEventListener('input', () => renderFeeList());
document.getElementById('sessionFilter')?.addEventListener('change', () => renderFeeList());
document.getElementById('yearFilter')?.addEventListener('change', () => renderFeeList());
document.getElementById('monthFilter')?.addEventListener('change', () => renderFeeList());
document.getElementById('groupBySelect')?.addEventListener('change', () => renderFeeList());
document.getElementById('editFeeBtn')?.addEventListener('click', editFeeRecord);
document.getElementById('deleteFeeBtn')?.addEventListener('click', deleteFeeRecord);
document.getElementById('sendInvoiceBtn')?.addEventListener('click', sendInvoice);
document.getElementById('sendReminderBtn')?.addEventListener('click', sendFeeReminder);

window.toggleGroup = toggleGroup;
window.updateFeePayment = updateFeePayment;
window.sendInvoice = sendInvoice;
window.sendFeeReminder = sendFeeReminder;
window.openReportModal = openReportModal;
window.closeReportModal = closeReportModal;

loadAllData();
</script>
