  const toast = document.getElementById('toastMsg');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function goBack() {
  if (window.parent && window.parent !== window) {
    if (typeof window.parent.closeIframe === 'function') {
      window.parent.closeIframe();
    } else {
      window.parent.location.href = 'index.html';
    }
  } else {
    window.location.href = 'index.html';
  }
}

// ==================== EXAM ID GENERATOR ====================
async function generateExamId() {
  const { data } = await supabase1
    .from("examinations")
    .select("exam_id")
    .order("exam_id", { ascending: false })
    .limit(1);
  
  let lastId = 0;
  if (data && data.length > 0 && data[0].exam_id) {
    const match = data[0].exam_id.match(/\d+/);
    if (match) lastId = parseInt(match[0]);
  }
  const newNum = lastId + 1;
  return `AEX-${String(newNum).padStart(6, '0')}`;
}

function isValidWhatsAppNumber(mobile) {
  if(!mobile || mobile === 'No mobile' || mobile === '') return false;
  let clean = mobile.replace(/[\s\-]/g, '');
  if(clean.length >= 10 && clean.length <= 13) {
    if(clean.match(/^(03|3|92)\d{9,10}$/)) return true;
  }
  return false;
}

function getResultMessage() {
  if(!currentStudentDetail) return "";
  const school = "The Leads High School (Dinga)";
  const exam = allExamTypes.find(e=>e.exam_type_id===selectedExamTypeId)?.exam_type1 || "Examination";
  let msg = `*📋 RESULT CARD - ${exam}*\n\n`;
  msg += `*Student:* ${currentStudentDetail.name}\n`;
  msg += `*Admission No:* ${currentStudentDetail.admission_no}\n`;
  msg += `*Father:* ${currentStudentDetail.father}\n`;
  msg += `*Class:* ${currentStudentDetail.classroom}\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━━\n\n`;
  msg += `*📖 SUBJECT-WISE MARKS*\n\n`;
  for(const sub of currentStudentDetail.subjects) {
    if(sub.absentInExam) msg += `📚 *${sub.name}*\n   Status: ❌ ABSENT in Exam\n\n`;
    else msg += `📚 *${sub.name}*\n   Marks: ${sub.obtained} / ${sub.max}\n   Grade: ${sub.grade}\n\n`;
  }
  msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
  msg += `*📊 SUMMARY*\n`;
  msg += `Total Marks: ${currentStudentDetail.totalObtained} / ${currentStudentDetail.totalMax}\n`;
  msg += `Percentage: ${currentStudentDetail.percentage.toFixed(2)}%\n`;
  msg += `Overall Grade: ${currentStudentDetail.grade}\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
  msg += `📅 Absent Days: ${currentStudentDetail.totalAbsentDays}\n\n`;
  msg += `📱 *Generated by: ${school}*`;
  return msg;
}

// TEXT SHARE - Direct WhatsApp
async function shareCurrentStudentResult() {
  if(!currentStudentDetail) return;
  const studentId = currentStudentDetail.id;
  const student = allStudents.find(s => s.stu_id === studentId);
  if(!student) { showToast("Student not found"); return; }
  let mobile = student.stu_mobile1 || student.stu_mobile2;
  if(!mobile || mobile === '') { alert("No mobile number found for this student"); return; }
  const isValid = isValidWhatsAppNumber(mobile);
  if(!isValid) { alert("Invalid WhatsApp number: " + mobile); return; }
  let cleanMobile = mobile.replace(/[\s\-]/g, '');
  if (cleanMobile.startsWith('0')) cleanMobile = cleanMobile.substring(1);
  if (!cleanMobile.startsWith('92')) cleanMobile = '92' + cleanMobile;
  const msg = getResultMessage();
  if (window.Android && window.Android.shareToWhatsApp) {
    window.Android.shareToWhatsApp(cleanMobile, msg);
    showToast("Opening WhatsApp...");
  } else {
    window.open(`https://wa.me/${cleanMobile}?text=${encodeURIComponent(msg)}`, '_blank');
    showToast("Opening WhatsApp...");
  }
}

function shareResultToWhatsAppImage() {
  const element = document.getElementById('resultCardToShare');

      link.click();

async function loadAllClassrooms() {
  const { data } = await supabase1.from("class_rooms").select("*").order("class_room_serial");

async function loadClassroomsForResults() {
  if(!selectedExamTypeId) {
    const select = document.getElementById('classroomFilter');
    select.innerHTML = '<option value="">-- Select Exam Type First --</option>';
    return;
  }
  const { data: dateSheets } = await supabase1.from("exam_date_sheet").select("exam_date_sheet_sub_id").eq("exam_date_sheet_exam_type_id", selectedExamTypeId);

}
async function loadDateSheets() { const { data } = await supabase1.from("exam_date_sheet").select("*"); if(data) allDateSheets = data; }
async function loadSubjects() { const { data } = await supabase1.from("subjects").select("*, subject_books!inner(*)").eq("sub_status", true); if(data) allSubjects = data; }
async function loadStudents() { const { data } = await supabase1.from("students").select("*").order("stu_name"); if(data) allStudents = data; }
async function loadExamResults() { const { data } = await supabase1.from("examinations").select("*"); if(data) { allExamResults = data; } }
async function loadCurrentSession() {
  const { data, error } = await supabase1.from("sch_sessions_default").select("session_id").limit(1);
  if (!error && data && data.length > 0) { currentSessionId = data[0].session_id; }
}
async function getStudentAbsentCount(studentId) {
  if (attendanceCache[studentId] !== undefined) return attendanceCache[studentId];
  if (!currentSessionId) { attendanceCache[studentId] = 0; return 0; }
  const { data, error } = await supabase1.from("students_attendence").select("stu_attendence_att_status_id").eq("stu_id", studentId).eq("session_id", currentSessionId);
  if (error || !data) { attendanceCache[studentId] = 0; return 0; }
  const absentCount = data.filter(record => record.stu_attendence_att_status_id === 2).length;
  attendanceCache[studentId] = absentCount;
  return absentCount;
}
function getClassroomName(id) { const c = allClassrooms.find(c => c.class_room_id == id); return c ? c.class_room_no : `Class ${id}`; }
function getClassroomOrder(className) { const classroom = allClassrooms.find(c => c.class_room_no === className); return classroom ? classroom.class_room_serial : 999; }
function getStudentsByClass(classroomId) { return allStudents.filter(s => s.stu_class_room_id === parseInt(classroomId)); }

// ==================== GRADE CALCULATION BASED ON PERCENTAGE ====================
function getConditionIdFromPercentage(percentage) {
  if(percentage >= 90) return 7;
  if(percentage >= 80) return 6;
  if(percentage >= 70) return 5;
  if(percentage >= 60) return 4;
  if(percentage >= 50) return 3;
  if(percentage >= 40) return 2;
  return 1;
}

function getGradeText(conditionId) {
  if(conditionId === 7) return { text: 'A+', class: 'grade-a-plus', order: 7 };
  if(conditionId === 6) return { text: 'A', class: 'grade-a', order: 6 };
  if(conditionId === 5) return { text: 'B+', class: 'grade-b-plus', order: 5 };
  if(conditionId === 4) return { text: 'B', class: 'grade-b', order: 4 };
  if(conditionId === 3) return { text: 'C', class: 'grade-c', order: 3 };
  if(conditionId === 2) return { text: 'E', class: 'grade-e', order: 2 };
  return { text: 'F', class: 'grade-f', order: 1 };
}

function getStudentAvatarHTML(student) {
  const initial = student.stu_name?.charAt(0).toUpperCase() || '?';
  if (student.stu_image && student.stu_image !== '' && student.stu_image !== null) {
    let imageSrc = student.stu_image;
    if (!imageSrc.startsWith('data:image')) { imageSrc = 'data:image/jpeg;base64,' + imageSrc; }
    return `<img src="${imageSrc}" class="student-img" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;" onerror="this.onerror=null; this.style.display='none'; this.parentElement.querySelector('.fallback-avatar').style.display='flex';">`;
  }
  return `<div class="student-result-avatar" style="width: 40px; height: 40px;">${initial}</div>`;
}

function getTopStudentForSubject(dateSheetId, subjectMaxMarks, classroomId) {
  const studentsInClass = getStudentsByClass(classroomId);
  let bestStudent = null; let bestMarks = -1;
  for(const student of studentsInClass) {
    const result = allExamResults.find(r => r.stu_id === student.stu_id && r.exam_exam_date_sheet_id === dateSheetId);
    if(result && result.exam_sub_marks_obtain !== null && result.exam_sub_marks_obtain !== '' && result.exam_absentees !== 1) {
      let marks = parseFloat(result.exam_sub_marks_obtain);
      if(!isNaN(marks) && marks > bestMarks) { bestMarks = marks; bestStudent = { ...student, obtainedMarks: Math.round(marks), maxMarks: subjectMaxMarks }; }
    }
  }
  return bestStudent;
}

// ==================== GROUPING FUNCTIONS ====================
function setGroupBy(type) {
  currentGroupBy = type;
  
  const classBtn = document.getElementById('groupByClassBtn');
  const dateBtn = document.getElementById('groupByDateBtn');
  
  if (type === 'class') {
    classBtn.classList.add('active');
    dateBtn.classList.remove('active');
  } else {
    dateBtn.classList.add('active');
    classBtn.classList.remove('active');
  }
  
  renderSubjectsList();
}

function getSubjectsGrouped(examTypeId) {
  const dateSheets = allDateSheets.filter(ds => ds.exam_date_sheet_exam_type_id === examTypeId);
  const grouped = {};
  
  if(currentGroupBy === 'class') {
    for(const ds of dateSheets) {
      const subject = allSubjects.find(s => s.sub_id == ds.exam_date_sheet_sub_id);
      if(subject) {
        const className = getClassroomName(subject.sub_classroom_id);
        if(!grouped[className]) grouped[className] = [];
        grouped[className].push({ 
          date_sheet_id: ds.exam_date_sheet_id, 
          date: ds.exam_date_sheet_day, 
          sub_id: subject.sub_id, 
          sub_name: subject.subject_books?.subject_books_name || 'Unknown', 
          max_marks: subject.sub_remarks || 100, 
          classroom_id: subject.sub_classroom_id 
        });
      }
    }
  } else {
    // Group by Date
    for(const ds of dateSheets) {
      const subject = allSubjects.find(s => s.sub_id == ds.exam_date_sheet_sub_id);
      if(subject) {
        const dateKey = ds.exam_date_sheet_day || 'No Date';
        if(!grouped[dateKey]) grouped[dateKey] = [];
        grouped[dateKey].push({ 
          date_sheet_id: ds.exam_date_sheet_id, 
          date: ds.exam_date_sheet_day, 
          sub_id: subject.sub_id, 
          sub_name: subject.subject_books?.subject_books_name || 'Unknown', 
          max_marks: subject.sub_remarks || 100, 
          classroom_id: subject.sub_classroom_id 
        });
      }
    }
  }
  return grouped;
}

// ==================== RENDER FUNCTIONS ====================
async function renderSubjectsList() {
  const subjectContainer = document.getElementById('subjectList');
  if(!selectedExamTypeId) { 
    subjectContainer.innerHTML = `<div class="empty-state">First select an exam type</div>`; 
    return; 
  }
  await loadAllClassrooms();
  const grouped = getSubjectsGrouped(selectedExamTypeId);
  
  let sortedKeys;
  if(currentGroupBy === 'class') {
    sortedKeys = Object.keys(grouped).sort((a, b) => getClassroomOrder(a) - getClassroomOrder(b));
  } else {
    sortedKeys = Object.keys(grouped).sort((a, b) => new Date(a) - new Date(b));
  }
  
  if(sortedKeys.length === 0) { 
    subjectContainer.innerHTML = `<div class="empty-state">No subjects found</div>`; 
    return; 
  }
  
  const dateSheetsForExam = allDateSheets.filter(ds => ds.exam_date_sheet_exam_type_id === selectedExamTypeId);
  const dateSheetIds = dateSheetsForExam.map(ds => ds.exam_date_sheet_id);
  let examResults = [];
  if(dateSheetIds.length > 0) { 
    const { data } = await supabase1.from("examinations").select("*").in("exam_exam_date_sheet_id", dateSheetIds); 
    examResults = data || []; 
    allExamResults = examResults; 
  }
  
  let html = '';
  for(const key of sortedKeys) {
    const subjects = grouped[key];
    const safeKey = key.replace(/[^a-zA-Z0-9]/g, '_');
    const isExpanded = savedGroupStates[key] === true;
    let classTotalMarked = 0;
    for(const sub of subjects) { 
      const studentsWithMarks = examResults.filter(r => r.exam_exam_date_sheet_id === sub.date_sheet_id && (parseFloat(r.exam_sub_marks_obtain) > 0 || r.exam_absentees === 1)); 
      if(studentsWithMarks.length > 0) classTotalMarked++; 
    }
    
    let headerIcon = currentGroupBy === 'class' ? '<i class="bi bi-building me-2"></i>' : '<i class="bi bi-calendar-event me-2"></i>';
    let headerText = currentGroupBy === 'class' ? key : `📅 ${key}`;
    
    html += `<div class="group-header ${isExpanded ? '' : 'collapsed'}" id="group-header-${safeKey}" onclick="toggleGroupAndSave('${key.replace(/'/g, "\\'")}')">
      <span>${headerIcon} ${headerText}</span>
      <div><span class="badge-subjects">${subjects.length} subjects (${classTotalMarked}/${subjects.length} marked)</span> <i class="bi bi-chevron-down toggle-icon ms-2"></i></div>
    </div>
    <div class="group-content ${isExpanded ? '' : 'collapsed'}" id="group-content-${safeKey}">`;
    
    for(const sub of subjects) {
      const topStudent = getTopStudentForSubject(sub.date_sheet_id, sub.max_marks, sub.classroom_id);
      const totalStudents = getStudentsByClass(sub.classroom_id).length;
      const markedCount = examResults.filter(r => r.exam_exam_date_sheet_id === sub.date_sheet_id && (parseFloat(r.exam_sub_marks_obtain) > 0 || r.exam_absentees === 1)).length;
      let statusText = '', statusColor = '';
      if(markedCount === 0) { statusText = `❌ 0/${totalStudents}`; statusColor = 'text-danger'; }
      else if(markedCount === totalStudents) { statusText = `✅ ${markedCount}/${totalStudents}`; statusColor = 'text-success'; }
      else { statusText = `⚠️ ${markedCount}/${totalStudents}`; statusColor = 'text-warning'; }
      let topStudentHtml = '';
      if(topStudent) { 
        topStudentHtml = `<div class="top-student-pill" onclick="event.stopPropagation(); showTopStudentDetail('${topStudent.stu_name}', ${topStudent.stu_id}, '${escapeHtml(sub.sub_name)}', ${topStudent.obtainedMarks}, ${sub.max_marks})"><i class="bi bi-trophy-fill text-success"></i> 🥇 First Position: <strong>${escapeHtml(topStudent.stu_name)}</strong> (${topStudent.obtainedMarks}/${sub.max_marks})</div>`; 
      } else if(markedCount > 0) { 
        topStudentHtml = `<div class="top-student-pill" style="background:#eef2ff; border-left-color:#94a3b8;"><i class="bi bi-emoji-neutral"></i> No eligible top student</div>`; 
      } else { 
        topStudentHtml = `<div class="top-student-pill" style="background:#f1f5f9; border-left-color:#cbd5e1;"><i class="bi bi-hourglass-split"></i> No marks entered yet</div>`; 
      }
      
      let dateDisplay = '';
      if(currentGroupBy === 'class' && sub.date) {
        dateDisplay = `<div class="small text-muted">📅 ${sub.date} | Max: ${sub.max_marks}</div>`;
      } else if(currentGroupBy === 'date') {
        const className = getClassroomName(sub.classroom_id);
        dateDisplay = `<div class="small text-muted">📚 ${className} | Max: ${sub.max_marks}</div>`;
      } else {
        dateDisplay = `<div class="small text-muted">Max: ${sub.max_marks}</div>`;
      }
      
      html += `<div class="subject-card" onclick="selectSubject('${sub.classroom_id}', '${escapeHtml(sub.sub_name)}', ${sub.max_marks}, '${sub.date_sheet_id}')">
        ${topStudentHtml}
        <div class="subject-main-row">
          <div>
            <strong>📖 ${escapeHtml(sub.sub_name)}</strong>
            ${dateDisplay}
          </div>
          <div class="text-end">
            <span class="status-badge ${statusColor}">${statusText}</span> 
            <i class="bi bi-chevron-right ms-2"></i>
          </div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  subjectContainer.innerHTML = html;
}

function toggleGroupAndSave(className) {
  const safeKey = className.replace(/[^a-zA-Z0-9]/g, '_');
  const content = document.getElementById(`group-content-${safeKey}`);
  const header = document.getElementById(`group-header-${safeKey}`);
  if(content) {
    if(content.classList.contains('collapsed')) { content.classList.remove('collapsed'); header?.classList.remove('collapsed'); savedGroupStates[className] = true; } 
    else { content.classList.add('collapsed'); header?.classList.add('collapsed'); savedGroupStates[className] = false; }
  }
}
function expandAllGroups() { document.querySelectorAll('.group-content').forEach(g => g.classList.remove('collapsed')); document.querySelectorAll('.group-header').forEach(h => h.classList.remove('collapsed')); Object.keys(savedGroupStates).forEach(k => savedGroupStates[k] = true); }
function collapseAllGroups() { document.querySelectorAll('.group-content').forEach(g => g.classList.add('collapsed')); document.querySelectorAll('.group-header').forEach(h => h.classList.add('collapsed')); Object.keys(savedGroupStates).forEach(k => savedGroupStates[k] = false); }

async function selectSubject(classroomId, subjectName, maxMarks, dateSheetId) {
  selectedClassroomId = parseInt(classroomId);
  selectedSubject = { classroom_id: selectedClassroomId, name: subjectName, max_marks: maxMarks, date_sheet_id: dateSheetId };
  const { data: freshResults } = await supabase1.from("examinations").select("*").eq("exam_exam_date_sheet_id", dateSheetId);
  const students = getStudentsByClass(selectedClassroomId);
  if(students.length === 0) { alert(`No students found`); return; }
  currentStudentMarks = {};
  for(const student of students) {
    const existing = freshResults?.find(r => r.stu_id === student.stu_id);
    let marksValue = '';
    if(existing && existing.exam_sub_marks_obtain !== null && existing.exam_sub_marks_obtain !== '') { const marksNum = parseFloat(existing.exam_sub_marks_obtain); marksValue = isNaN(marksNum) ? '' : Math.round(marksNum).toString(); }
    currentStudentMarks[student.stu_id] = marksValue;
  }
  let studentsHtml = '';
  for(const student of students) {
    const initial = student.stu_name?.charAt(0).toUpperCase() || '?';
    const currentMark = currentStudentMarks[student.stu_id] || '';
    let avatarHtml = getStudentAvatarHTML(student);
    if (student.stu_image && student.stu_image !== '') {
      avatarHtml = `<div style="position: relative; width: 40px; height: 40px; flex-shrink: 0;">${avatarHtml}<div class="fallback-avatar" style="display: none; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); align-items: center; justify-content: center; color: white; font-weight: bold; position: absolute; top: 0; left: 0;">${initial}</div></div>`;
    }
    studentsHtml += `<div class="student-card"><div class="student-info">${avatarHtml}<div><div class="fw-bold">${escapeHtml(student.stu_name)}</div><div class="small text-muted">${escapeHtml(student.stu_admission_no)} | ${escapeHtml(student.stu_father)}</div></div></div><div><input type="number" id="mark_${student.stu_id}" class="marks-input" value="${currentMark}" step="1" min="0" max="${maxMarks}" placeholder="Marks" onchange="updateStudentMark(${student.stu_id}, this.value)"><span class="text-muted small">/${maxMarks}</span></div></div>`;
  }
  document.getElementById('studentsContainer').innerHTML = studentsHtml;
  document.getElementById('dateSheetMainView').style.display = 'none';
  document.getElementById('dateSheetStudentsView').style.display = 'block';
}
function updateStudentMark(studentId, marks) { currentStudentMarks[studentId] = Math.round(parseFloat(marks) || 0).toString(); }
function backToSubjects() { document.getElementById('dateSheetMainView').style.display = 'block'; document.getElementById('dateSheetStudentsView').style.display = 'none'; renderSubjectsList(); }

async function saveAllStudentMarks() {
  if(!selectedExamTypeId || !selectedSubject) { alert("Please select exam type and subject first"); return; }
  const students = getStudentsByClass(selectedClassroomId);
  const totalStudents = students.length;
  const progressContainer = document.getElementById('saveProgressContainer');
  const progressBar = document.getElementById('saveProgressBar');
  const progressText = document.getElementById('saveProgressText');
  const saveBtn = document.getElementById('saveAllBtn');
  progressContainer.style.display = 'block';
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="loading-spinner-small"></span> Saving...';
  progressBar.style.width = '0%';
  let saved = 0, failed = 0;
  for(let i = 0; i < students.length; i++) {
    const student = students[i];
    const obtained = Math.round(parseFloat(currentStudentMarks[student.stu_id]) || 0);
    const obtainedStr = obtained.toString();
    const maxMarks = selectedSubject.max_marks;
    const percentage = (obtained / maxMarks) * 100;
    let conditionId = getConditionIdFromPercentage(percentage);
    const { data: existing } = await supabase1.from("examinations").select("exam_id").eq("stu_id", student.stu_id).eq("exam_exam_date_sheet_id", selectedSubject.date_sheet_id).maybeSingle();
    let result;
    if(existing) {
      result = await supabase1.from("examinations").update({ 
        exam_sub_marks_obtain: obtainedStr, 
        exam_exam_result_condition_id: conditionId 
      }).eq("stu_id", student.stu_id).eq("exam_exam_date_sheet_id", selectedSubject.date_sheet_id);
    } else {
      const examId = await generateExamId();
      result = await supabase1.from("examinations").insert([{ 
        exam_id: examId,
        stu_id: student.stu_id, 
        exam_exam_date_sheet_id: selectedSubject.date_sheet_id, 
        exam_sub_marks_obtain: obtainedStr, 
        exam_exam_result_condition_id: conditionId, 
        exam_absentees: 0 
      }]);
    }
    if(result.error) { 
      console.error("Save error:", result.error);
      failed++; 
    } else { 
      saved++; 
    }
    const percent = Math.round(((i + 1) / totalStudents) * 100);
    progressBar.style.width = `${percent}%`;
    progressText.innerText = `${i+1}/${totalStudents} (✅${saved} ⚠️${failed})`;
    await new Promise(r => setTimeout(r, 10));
  }
  progressBar.style.width = '100%';
  progressText.innerText = `✅ Complete! Saved: ${saved}, Failed: ${failed}`;
  setTimeout(() => { progressContainer.style.display = 'none'; saveBtn.disabled = false; saveBtn.innerHTML = '<i class="bi bi-save"></i> Save All Results'; }, 2000);
  alert(`✅ Saved: ${saved}\n❌ Failed: ${failed}`);
  await renderSubjectsList();
  if(selectedSubject) { await selectSubject(selectedClassroomId, selectedSubject.name, selectedSubject.max_marks, selectedSubject.date_sheet_id); }
}

function showTopStudentDetail(name, id, subName, obt, maxM) { const s = allStudents.find(st => st.stu_id === id); if(!s) return; const cls = getClassroomName(s.stu_class_room_id); const perc = (obt / maxM) * 100; const grade = getGradeText(getConditionIdFromPercentage(perc)); const modalHtml = `<div class="detail-card"><div><strong>👤 ${escapeHtml(s.stu_name)}</strong></div><div class="small text-muted">${escapeHtml(s.stu_admission_no)} | ${escapeHtml(s.stu_father)}</div><div class="small text-muted">Class: ${cls}</div><hr><div><strong>📘 Subject:</strong> ${escapeHtml(subName)}</div><div><strong>🏆 Marks:</strong> ${obt} / ${maxM}</div><div><strong>📊 Percentage:</strong> ${perc.toFixed(2)}%</div><div><strong>⭐ Grade:</strong> <span class="grade-badge ${grade.class}">${grade.text}</span></div></div>`; document.getElementById('modalStudentDetailContent').innerHTML = modalHtml; document.getElementById('topStudentModal').classList.add('show'); }
function closeTopStudentModal(e) { if(!e || e.target.classList.contains('modal-custom') || e.target.classList.contains('btn-close')) document.getElementById('topStudentModal').classList.remove('show'); }
function setSortBy(t) { currentSortBy = t; renderStudentsResultList(); }
function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':(m==='<'?'&lt;':'&gt;')); }

async function renderStudentsResultList() { 
  const container = document.getElementById('studentsResultList'); 
  const classroomId = document.getElementById('classroomFilter').value; 
  if(!selectedExamTypeId) { 
    container.innerHTML = `<div class="empty-state">Please select an exam type first</div>`; 
    return; 
  }
  if(!classroomId || classroomId === "") { 
    container.innerHTML = `<div class="empty-state">Please select a classroom</div>`; 
    return; 
  }
  await loadExamResults(); 
  await loadAllClassrooms();
  const students = getStudentsByClass(classroomId); 
  if(students.length === 0) {
    container.innerHTML = `<div class="empty-state">No students found in this class</div>`;
    return;
  }
  const className = getClassroomName(classroomId); 
  const dateSheetsForExam = allDateSheets.filter(ds => ds.exam_date_sheet_exam_type_id === selectedExamTypeId); 
  let studentsData = []; 
  for(const student of students) { 
    let totalObtained = 0, totalMax = 0, examAbsentCount = 0; 
    for(const ds of dateSheetsForExam) { 
      const subject = allSubjects.find(s => s.sub_id == ds.exam_date_sheet_sub_id); 
      if(subject && subject.sub_classroom_id === student.stu_class_room_id) { 
        const maxMarks = subject.sub_remarks || 100; 
        totalMax += maxMarks; 
        const result = allExamResults.find(r => r.stu_id === student.stu_id && r.exam_exam_date_sheet_id === ds.exam_date_sheet_id); 
        if(result && result.exam_absentees === 1) { 
          examAbsentCount++; 
        } else { 
          const obtained = result ? (parseFloat(result.exam_sub_marks_obtain) || 0) : 0; 
          totalObtained += Math.round(obtained); 
        } 
      } 
    } 
    const hasResult = (totalObtained > 0) || (examAbsentCount > 0); 
    const percentage = totalMax > 0 ? (totalObtained / totalMax) * 100 : 0; 
    const grade = getGradeText(getConditionIdFromPercentage(percentage)); 
    studentsData.push({ ...student, totalObtained, totalMax, hasResult, percentage, grade: grade, marksText: hasResult ? `${totalObtained} / ${totalMax}` : null, examAbsentCount }); 
  } 
  const withResults = studentsData.filter(s => s.hasResult).sort((a,b) => b.totalObtained - a.totalObtained); 
  let position = 1; 
  for(let i=0;i<withResults.length;i++) { 
    if(i>0 && withResults[i].totalObtained < withResults[i-1].totalObtained) position = i+1; 
    withResults[i].position = position; 
  } 
  for(const s of studentsData) { 
    const found = withResults.find(w => w.stu_id === s.stu_id); 
    s.position = found?.position || null; 
  } 
  if(currentSortBy === 'position') {
    studentsData.sort((a,b) => { 
      if(!a.hasResult && !b.hasResult) return a.stu_name.localeCompare(b.stu_name); 
      if(!a.hasResult) return 1; 
      if(!b.hasResult) return -1; 
      return (a.position || 999) - (b.position || 999); 
    });
  } else if(currentSortBy === 'grade') {
    studentsData.sort((a,b) => { 
      if(!a.hasResult && !b.hasResult) return a.stu_name.localeCompare(b.stu_name); 
      if(!a.hasResult) return 1; 
      if(!b.hasResult) return -1; 
      return (b.grade?.order || 0) - (a.grade?.order || 0); 
    });
  } else if(currentSortBy === 'admission') {
    studentsData.sort((a,b) => (a.stu_admission_no || '').localeCompare(b.stu_admission_no || '', undefined, { numeric: true }));
  } else {
    studentsData.sort((a,b) => a.stu_name.localeCompare(b.stu_name));
  }
  const totalStudents = students.length;
  const studentsWithMarks = studentsData.filter(s => s.hasResult).length;
  let html = `<div class="class-header">
    <div class="class-name">📚 ${escapeHtml(className)}</div>
    <div class="class-stats">${studentsWithMarks}/${totalStudents} students</div>
  </div>`; 
  for(const s of studentsData) { 
    let positionClass = '';
    let positionText = '';
    if(s.position === 1) { 
      positionClass = 'first';
      positionText = '🥇 First Position';
    } else if(s.position === 2) { 
      positionClass = 'second';
      positionText = '🥈 Second Position';
    } else if(s.position === 3) { 
      positionClass = 'third';
      positionText = '🥉 Third Position';
    }
    let gradeClass = s.grade?.class || '';
    let gradeText = s.grade?.text || '—';
    
    const initial = s.stu_name?.charAt(0).toUpperCase() || '?';
    let avatarHtml = '';
    if (s.stu_image && s.stu_image !== '' && s.stu_image !== null) {
      let imageSrc = s.stu_image;
      if (!imageSrc.startsWith('data:image')) { imageSrc = 'data:image/jpeg;base64,' + imageSrc; }
      avatarHtml = `<img src="${imageSrc}" class="student-result-img" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover;" onerror="this.onerror=null; this.style.display='none'; this.parentElement.querySelector('.fallback-avatar').style.display='flex';">`;
    } else {
      avatarHtml = `<div class="student-result-avatar">${initial}</div>`;
    }
    
    if(s.hasResult) { 
      html += `<div class="student-result-card ${s.position === 1 ? 'first-rank' : (s.position === 2 ? 'second-rank' : (s.position === 3 ? 'third-rank' : ''))}" onclick="viewStudentResult(${s.stu_id})">
        <div class="result-card-top">
          ${positionText ? `<div class="position-pill ${positionClass}">${positionText}</div>` : '<div></div>'}
          <div class="grade-pill ${gradeClass}">${gradeText}</div>
        </div>
        <div class="student-result-row">
          ${avatarHtml}
          <div class="student-result-info">
            <div class="student-result-name">${escapeHtml(s.stu_name)}</div>
            <div class="student-result-details">${escapeHtml(s.stu_admission_no)} | ${escapeHtml(s.stu_father)}</div>
          </div>
          <div class="student-result-marks">
            <div class="marks-obtained">${s.marksText}</div>
            <div class="marks-percentage">${s.percentage.toFixed(1)}%</div>
          </div>
        </div>
      </div>`; 
    } else { 
      html += `<div class="student-result-card" onclick="viewStudentResult(${s.stu_id})">
        <div class="result-card-top">
          <div class="position-pill normal"><i class="bi bi-hourglass-split"></i> Result Pending</div>
          <div class="grade-pill not-entered">Not entered</div>
        </div>
        <div class="student-result-row">
          ${avatarHtml}
          <div class="student-result-info">
            <div class="student-result-name">${escapeHtml(s.stu_name)}</div>
            <div class="student-result-details">${escapeHtml(s.stu_admission_no)} | ${escapeHtml(s.stu_father)}</div>
          </div>
          <div class="student-result-marks">
            <div class="not-entered">📝 Result not entered</div>
          </div>
        </div>
      </div>`; 
    } 
  } 
  container.innerHTML = html; 
}

// viewStudentResult with FIXED grade calculation
async function viewStudentResult(studentId) {
  const s = allStudents.find(x=>x.stu_id===studentId);
  const sheets = allDateSheets.filter(ds => ds.exam_date_sheet_exam_type_id === selectedExamTypeId);
  const cls = getClassroomName(s.stu_class_room_id);
  let totalO = 0, totalM = 0, subsHtml = '', subs = [];
  const totalAbsentDays = await getStudentAbsentCount(studentId);
  
  for(const ds of sheets){
    const sub = allSubjects.find(sb => sb.sub_id === ds.exam_date_sheet_sub_id);
    if(sub && sub.sub_classroom_id === s.stu_class_room_id){
      const maxM = sub.sub_remarks || 100;
      totalM += maxM;
      const res = allExamResults.find(r => r.stu_id === s.stu_id && r.exam_exam_date_sheet_id === ds.exam_date_sheet_id);
      const isAbsentInExam = res ? (res.exam_absentees === 1) : false;
      let obt = 0;
      if(!isAbsentInExam && res && res.exam_sub_marks_obtain !== null && res.exam_sub_marks_obtain !== '') { 
        obt = Math.round(parseFloat(res.exam_sub_marks_obtain)||0); 
      }
      if(!isAbsentInExam) totalO += obt;
      
      // Calculate percentage based on max marks of this subject
      const subjectPercentage = maxM > 0 ? (obt / maxM) * 100 : 0;
      const subjectConditionId = getConditionIdFromPercentage(subjectPercentage);
      const subjectGrade = getGradeText(subjectConditionId);
      
      subs.push({ name: sub.subject_books?.subject_books_name||'Unknown', obtained: obt, max: maxM, grade: subjectGrade.text, absentInExam: isAbsentInExam });
      
      if(isAbsentInExam) { 
        subsHtml += `<div class="subject-row">
          <div class="subject-name">${escapeHtml(sub.subject_books?.subject_books_name||'Unknown')}</div>
          <div><span class="absent-badge"><i class="bi bi-person-x"></i> Absent</span></div>
        </div>`; 
      } else { 
        subsHtml += `<div class="subject-row">
          <div class="subject-name">${escapeHtml(sub.subject_books?.subject_books_name||'Unknown')}</div>
          <div>
            <span class="subject-marks">${obt} / ${maxM}</span>
            <span class="subject-grade ${subjectGrade.class}">${subjectGrade.text}</span>
          </div>
        </div>`; 
      }
    }
  }
  
  const perc = totalM > 0 ? (totalO / totalM) * 100 : 0;
  const totalG = getGradeText(getConditionIdFromPercentage(perc));
  
  const initial = s.stu_name?.charAt(0).toUpperCase() || '?';
  let avatarHtml = '';
  
  if (s.stu_image && s.stu_image !== '' && s.stu_image !== null) {
    let imageSrc = s.stu_image;
    if (!imageSrc.startsWith('data:image')) { 
      imageSrc = 'data:image/jpeg;base64,' + imageSrc; 
    }
    avatarHtml = `<img src="${imageSrc}" class="student-detail-img" 
      style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" 
      onerror="this.onerror=null; this.style.display='none'; this.outerHTML='<div class=\\'student-detail-avatar\\' style=\\'width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.8rem;\\'>${initial}</div>';">`;
  } else {
    avatarHtml = `<div class="student-detail-avatar" style="width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.8rem;">${initial}</div>`;
  }
  
  const detailHtml = `<div class="detail-card" id="resultCardToShare">
    <div class="student-detail-header" style="display: flex; gap: 16px; align-items: center; padding: 18px 20px; background: linear-gradient(135deg, #eef2ff, #e0e7ff); border-bottom: 2px solid #c7d2fe;">
      <div style="position:relative;">${avatarHtml}</div>
      <div class="student-detail-info" style="flex: 1;">
        <div class="student-detail-name" style="font-size: 1.2rem; font-weight: 700; color: #1e3c72; margin-bottom: 8px;">${escapeHtml(s.stu_name)}</div>
        <div class="student-detail-meta" style="font-size: 0.75rem; color: #475569; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;">
          <span>${escapeHtml(s.stu_admission_no)}</span>
          <span>|</span>
          <span>${escapeHtml(s.stu_father)}</span>
          <span>|</span>
          <span class="class-highlight" style="background: #1e3c72; color: white; padding: 3px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600;">Class: ${cls}</span>
        </div>
      </div>
    </div>
    <div class="fw-bold mb-2" style="padding: 12px 20px 0 20px;">📖 Subject-wise Marks</div>
    ${subsHtml || '<div class="empty-state" style="margin: 0 20px;">No results found</div>'}
    <div class="result-summary" style="background: #eef2ff; padding: 15px 20px;">
      <div class="d-flex justify-content-between mb-2">
        <span>Total Marks:</span>
        <span><strong>${totalO}/${totalM}</strong></span>
      </div>
      <div class="d-flex justify-content-between mb-2">
        <span>Percentage:</span>
        <span><strong>${perc.toFixed(2)}%</strong></span>
      </div>
      <div class="d-flex justify-content-between">
        <span>Overall Grade:</span>
        <span><strong class="grade-badge ${totalG.class}" style="background: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600;">${totalG.text}</strong></span>
      </div>
    </div>
    <div class="absentees-summary" style="background: #fff3e0; padding: 12px 20px; border-top: 1px solid #fef3c7;">
      <div class="d-flex justify-content-between align-items-center">
        <span><i class="bi bi-calendar-x me-2"></i> <strong>Total Absent Days</strong></span>
        <span class="badge" style="background:#f59e0b; color:white; padding:6px 14px; border-radius: 30px;">${totalAbsentDays} Day${totalAbsentDays !== 1 ? 's' : ''}</span>
      </div>
      <div class="small text-muted mt-2">Based on attendance records for current academic session</div>
    </div>
  </div>`;
  
  document.getElementById('studentDetail').innerHTML = detailHtml;
  document.getElementById('studentsResultList').style.display = 'none';
  document.querySelector('#tab2 .class-filter-row').style.display = 'none';
  document.querySelector('#tab2 .sort-bar').style.display = 'none';
  document.getElementById('studentDetailView').style.display = 'block';
  document.getElementById('shareWhatsAppTextBtn').style.display = 'flex';
  document.getElementById('shareWhatsAppImageBtn').style.display = 'flex';
  currentStudentDetail = { name:s.stu_name, admission_no:s.stu_admission_no, father:s.stu_father, classroom:cls, classroomId:s.stu_class_room_id, totalObtained:totalO, totalMax:totalM, percentage:perc, grade:totalG.text, subjects:subs, totalAbsentDays: totalAbsentDays, id:s.stu_id };
}

  document.getElementById('studentsResultList').style.display = 'block';

function switchTab(tab) { 
  currentTab = tab; 
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', parseInt(btn.dataset.tab) === tab)); 
  document.getElementById('tab1').classList.toggle('active', tab === 1); 
  document.getElementById('tab2').classList.toggle('active', tab === 2); 
  if(tab === 1) { 
    renderSubjectsList(); 
  } else { 
    if(selectedExamTypeId) {
      loadClassroomsForResults().then(() => { renderStudentsResultList(); });
    } else {
      renderStudentsResultList();
    }
  } 
}
