<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"/>
<title>Class Chat | Admin</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { 
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  body { 
    background: #f0f4f8; 
  }
  .app-container { 
    max-width: 550px; 
    margin: 0 auto; 
    padding: 12px; 
  }
  
  /* Card Styles */
  .card-custom {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 24px);
    max-height: 750px;
  }
  .card-header-custom {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    padding: 12px 16px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .back-btn, .clear-all-btn, .select-mode-btn, .students-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 20px;
    padding: 5px 10px;
    color: white;
    font-size: 0.7rem;
    cursor: pointer;
    transition: background 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .back-btn:hover, .clear-all-btn:hover, .select-mode-btn:hover, .students-btn:hover {
    background: rgba(255,255,255,0.25);
  }
  .clear-all-btn:hover { background: rgba(220, 38, 38, 0.8); }
  
  .room-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .room-title i { font-size: 1rem; }
  
  /* Selection Header */
  .selection-header {
    background: #ef4444;
    color: white;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .selected-badge {
    background: #f59e0b;
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 0.7rem;
  }
  
  /* List Items with Unread Badge */
  .list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #eef2f8;
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
  }
  .list-item:active { background: #f8fafc; }
  .list-icon {
    width: 44px;
    height: 44px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    color: white;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  .list-info { flex: 1; }
  .list-title { 
    font-weight: 600; 
    font-size: 0.9rem; 
    color: #1e293b;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .list-subtitle { font-size: 0.6rem; color: #64748b; margin-top: 2px; }
  .list-badge {
    background: #f1f5f9;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 0.65rem;
    color: #475569;
  }
  /* Unread Message Badge */
  .unread-badge {
    background: #ef4444;
    color: white;
    border-radius: 30px;
    padding: 2px 8px;
    font-size: 0.65rem;
    font-weight: 600;
    min-width: 22px;
    text-align: center;
    animation: pulse 0.5s ease-in-out;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  .last-msg-preview {
    font-size: 0.6rem;
    color: #94a3b8;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
  }
  
  /* Chat Messages */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: #f8fafc;
  }
  .message {
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }
  .message.sent { justify-content: flex-end; }
  .message.received { justify-content: flex-start; }
  .message-bubble {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 18px;
    font-size: 0.8rem;
    position: relative;
  }
  .message.sent .message-bubble {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.received .message-bubble {
    background: white;
    color: #1e293b;
    border: 1px solid #eef2f8;
    border-bottom-left-radius: 4px;
  }
  .message-sender {
    font-size: 0.6rem;
    font-weight: 600;
    margin-bottom: 2px;
    color: #64748b;
  }
  .message-time {
    font-size: 0.5rem;
    margin-top: 3px;
    opacity: 0.6;
  }
  .message-checkbox {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 2px solid #cbd5e1;
    background: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 8px;
  }
  .message-checkbox.checked {
    background: #1e3c72;
    border-color: #1e3c72;
    color: white;
  }
  
  /* Voice & Image */
  .voice-message audio { height: 32px; max-width: 180px; }
  .chat-image { max-width: 180px; border-radius: 12px; cursor: pointer; }
  
  /* Chat Input - Fixed Bottom */
  .chat-input-area {
    display: flex;
    gap: 6px;
    padding: 10px 12px;
    background: white;
    border-top: 1px solid #eef2f8;
    align-items: center;
    flex-shrink: 0;
    position: relative;
  }
  .chat-input {
    flex: 1;
    border: 1px solid #e2e8f0;
    border-radius: 24px;
    padding: 8px 14px;
    font-size: 0.85rem;
    outline: none;
    background: #f8fafc;
  }
  .chat-input:focus { border-color: #1e3c72; background: white; }
  .chat-btn {
    background: #f1f5f9;
    border: none;
    border-radius: 24px;
    padding: 7px 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1rem;
  }
  .chat-btn:hover { background: #e2e8f0; }
  .send-btn {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    padding: 7px 16px;
  }
  .recording-active {
    background: #ef4444;
    color: white;
    animation: pulse 1s infinite;
  }
  
  /* Emoji Dropdown */
  .emoji-dropdown {
    position: absolute;
    bottom: 65px;
    left: 10px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    padding: 8px;
    display: none;
    z-index: 1000;
    width: 260px;
    max-height: 280px;
    overflow-y: auto;
  }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .emoji-item {
    font-size: 1.2rem;
    cursor: pointer;
    text-align: center;
    padding: 4px;
    border-radius: 8px;
  }
  .emoji-item:hover { background: #f1f5f9; }
  
  /* Student List Modal */
  .student-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid #eef2f8;
  }
  .student-avatar-small {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 0.9rem;
  }
  .online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }
  .online { background: #10b981; }
  .offline { background: #ef4444; }
  
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #94a3b8;
  }
  
  /* Toast */
  #customToast {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 0.7rem;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="app-container" id="appContainer"></div>

<!-- Students List Modal -->
<div class="modal fade" id="studentsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2" style="background: linear-gradient(135deg, #11998e, #38ef7d); color: white;">
        <h5 class="modal-title fs-6"><i class="bi bi-people-fill me-2"></i>Class Students</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <div id="studentsListModal" class="student-modal-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- Image Preview Modal -->
<div class="modal fade" id="imagePreviewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-transparent border-0">
      <div class="text-end mb-2">
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <img id="previewImage" src="" class="rounded-3" style="max-width: 100%;">
    </div>
  </div>
</div>

<script>
// Supabase configuration
const SUPABASE_URL = "https://tqcfcztyvmedmuhohpps.supabase.co";
const SUPABASE_KEY = "sb_publishable_mnk4CySLaCI-FwtKJ9DhMg_z852ATHH";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentAdmin = { emp_id: 1, emp_name: "Admin" };
let allClasses = [];
let currentClass = null;
let currentMessages = [];
let messageSubscription = null;
let allStudents = [];
let selectMode = false;
let selectedMessages = new Set();
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordingTimer = null;

// Store last read message timestamp per class
let lastReadTimestamps = {};

const emojis = ["😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🥰","😍","🤩","😘","😗","😚","😙","🥲","😋","😛","😜","🤪","😝","🤑","🤗","🤭","🤫","🤔","🤐","🤨","😐","😑","😶","😏","😒","🙄","😬","😌","😔","😪","🤤","😴","😷","🤒","🤕","🥳","😎","🤓","🧐","😕","😟","🙁","☹️","😮","😯","😲","😳","🥺","😢","😭","😱","😖","😣","😞","😓","😩","😫","🥱","😤","😡","😠","🤬","😈","👿","💀","☠️","💩","🤡","👻","👽","🤖","😺","😸","😹","😻","😼","😽","🙀","😿","😾","🙈","🙉","🙊","💋","💌","💘","💝","💖","💗","💓","💞","💕","💔","❤️","🧡","💛","💚","💙","💜","🤎","🖤","🤍","💯","💢","💥","💫","💦","💨","💣","💬","👋","🤚","🖐️","✋","🖖","👌","🤏","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","🖕","👇","☝️","👍","👎","✊","👊","🤛","🤜","👏","🙌","👐","🤲","🤝","🙏","✍️","💅","🤳","💪","🦵","🦶","👂","👃","🧠","🦷","🦴","👀","👅","👄","❤️","🔥","✨","⭐","✅","🎉"];

function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
function formatTime(date) { return new Date(date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

function showToast(msg, isErr = false) {
  let toast = document.getElementById('customToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'customToast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.background = isErr ? '#ef4444' : '#333';
  toast.style.opacity = '1';
  setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}

// Get unread count for a class
async function getUnreadCount(classId) {
  const lastRead = lastReadTimestamps[classId] || new Date(0).toISOString();
  const { count, error } = await supabaseClient
    .from("class_chat_messages")
    .select("*", { count: "exact", head: true })
    .eq("class_id", classId)
    .gt("created_at", lastRead)
    .neq("sender_type", "admin");
  
  if (error) return 0;
  return count || 0;
}

// Get last message preview for a class
async function getLastMessagePreview(classId) {
  const { data, error } = await supabaseClient
    .from("class_chat_messages")
    .select("message, message_type, created_at, sender_name")
    .eq("class_id", classId)
    .order("created_at", { ascending: false })
    .limit(1);
  
  if (error || !data || data.length === 0) return null;
  const msg = data[0];
  let preview = msg.message_type === 'image' ? '📸 Image' : (msg.message_type === 'voice' ? '🎤 Voice message' : msg.message);
  if (preview && preview.length > 30) preview = preview.substring(0, 30) + '...';
  return { preview, time: formatTime(msg.created_at), sender: msg.sender_name };
}

function goBack() {
  if (messageSubscription) supabaseClient.removeChannel(messageSubscription);
  currentClass = null; currentMessages = []; selectMode = false; selectedMessages.clear();
  showClassesList();
}

async function clearAllMessages() {
  if (!currentClass) { showToast("No chat room open", true); return; }
  const classId = currentClass.class_room_id;
  if (!classId) { showToast("Invalid room", true); return; }
  if (!confirm(`Delete ALL messages in ${currentClass.class_room_no}?`)) return;
  const { error } = await supabaseClient.from("class_chat_messages").delete().eq("class_id", classId);
  if (error) showToast("Failed: " + error.message, true);
  else { currentMessages = []; renderMessages(); showToast("All messages cleared"); }
}

async function loadClasses() {
  const { data } = await supabaseClient.from("class_rooms").select("*").order("class_room_serial");
  if (data) allClasses = data;
}

async function showClassesList() {
  const container = document.getElementById('appContainer');
  let html = '';
  if (allClasses.length === 0) {
    html = '<div class="empty-state"><i class="bi bi-inbox" style="font-size:2rem;"></i><p class="mt-2">No classes</p></div>';
  } else {
    for (const cls of allClasses) {
      const unreadCount = await getUnreadCount(cls.class_room_id);
      const lastMsg = await getLastMessagePreview(cls.class_room_id);
      const unreadBadge = unreadCount > 0 ? `<span class="unread-badge">${unreadCount > 99 ? '99+' : unreadCount}</span>` : '';
      const lastMsgHtml = lastMsg ? `<div class="last-msg-preview"><i class="bi bi-chat-text"></i> ${escapeHtml(lastMsg.sender || 'Student')}: ${escapeHtml(lastMsg.preview)}</div>` : '<div class="last-msg-preview text-muted"><i class="bi bi-chat-dots"></i> No messages yet</div>';
      
      html += `<div class="list-item" onclick="openChatRoom(${cls.class_room_id})">
        <div class="list-icon"><i class="bi bi-building"></i></div>
        <div class="list-info">
          <div class="list-title">${escapeHtml(cls.class_room_no)} ${unreadBadge}</div>
          ${lastMsgHtml}
        </div>
        <div class="list-badge"><i class="bi bi-chat-dots-fill"></i> Enter</div>
      </div>`;
    }
  }
  container.innerHTML = `<div class="card-custom"><div class="card-header-custom"><button class="back-btn" onclick="goBack()"><i class="bi bi-arrow-left"></i> Back</button><div class="room-title"><i class="bi bi-chat-dots-fill"></i> Chat Rooms</div><div style="width:50px;"></div></div><div style="flex:1; overflow-y:auto;">${html}</div></div>`;
}

function toggleSelectMode() { selectMode = !selectMode; if (!selectMode) selectedMessages.clear(); renderMessages(); renderChatWindowHeader(); }
function toggleSelectMessage(id) { if (selectedMessages.has(id)) selectedMessages.delete(id); else selectedMessages.add(id); renderMessages(); renderChatWindowHeader(); }
async function deleteSelectedMessages() {
  if (selectedMessages.size === 0) { showToast("No messages selected", true); return; }
  if (!confirm(`Delete ${selectedMessages.size} message(s)?`)) return;
  const ids = Array.from(selectedMessages);
  const { error } = await supabaseClient.from("class_chat_messages").update({ is_deleted: true, message: "Deleted" }).in("id", ids);
  if (error) showToast("Failed", true);
  else {
    for (const id of ids) { const idx = currentMessages.findIndex(m => m.id === id); if (idx !== -1) { currentMessages[idx].is_deleted = true; currentMessages[idx].message = "Deleted"; } }
    selectedMessages.clear(); selectMode = false; renderMessages(); renderChatWindowHeader(); showToast(`${ids.length} message(s) deleted`);
  }
}

window.openChatRoom = async function(classId) {
  const selectedClass = allClasses.find(c => c.class_room_id === classId);
  if (!selectedClass) { showToast("Class not found", true); return; }
  currentClass = selectedClass;
  selectMode = false; selectedMessages.clear();
  
  // Update last read timestamp for this class
  lastReadTimestamps[classId] = new Date().toISOString();
  
  const { data: students } = await supabaseClient.from("students").select("*").eq("stu_class_room_id", classId).order("stu_name");
  if (students) allStudents = students;
  if (messageSubscription) await supabaseClient.removeChannel(messageSubscription);
  messageSubscription = supabaseClient.channel(`class_chat_${classId}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'class_chat_messages', filter: `class_id=eq.${classId}` }, (p) => { 
      currentMessages.push(p.new); 
      renderMessages();
      // Update unread count in class list when not in this chat
      if (currentClass?.class_room_id !== classId) {
        showClassesList();
      }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'class_chat_messages', filter: `class_id=eq.${classId}` }, (p) => { 
      const i = currentMessages.findIndex(m => m.id === p.new.id); 
      if (i !== -1) { currentMessages[i] = p.new; renderMessages(); } 
    })
    .subscribe();
  const { data: msgs } = await supabaseClient.from("class_chat_messages").select("*").eq("class_id", classId).order("created_at", { ascending: true });
  if (msgs) currentMessages = msgs;
  renderChatWindow();
  showToast(`Now in ${selectedClass.class_room_no}`);
};

function renderMessages() {
  const container = document.getElementById('chatMessages');
  if (!container) return;
  let html = '';
  for (const msg of currentMessages) {
    const isSent = msg.sender_type === 'admin';
    const isDel = msg.is_deleted === true;
    const time = formatTime(msg.created_at);
    const isSelected = selectedMessages.has(msg.id);
    let content = '';
    if (isDel) content = `<div class="deleted-text"><i class="bi bi-trash3"></i> Deleted</div>`;
    else if (msg.message_type === 'image') content = `<img src="${msg.media_url}" class="chat-image" onclick="showImagePreview('${msg.media_url}')">`;
    else if (msg.message_type === 'voice') content = `<div class="voice-message"><audio controls src="${msg.media_url}"></audio></div>`;
    else content = escapeHtml(msg.message);
    const showCheck = selectMode && isSent && !isDel;
    const chkHtml = showCheck ? `<div class="message-checkbox ${isSelected ? 'checked' : ''}" onclick="toggleSelectMessage(${msg.id})">${isSelected ? '<i class="bi bi-check-lg"></i>' : ''}</div>` : '';
    html += `<div class="message ${isSent ? 'sent' : 'received'} ${isDel ? 'deleted' : ''}">${chkHtml}<div class="message-bubble">${!isSent && !isDel ? `<div class="message-sender">${escapeHtml(msg.sender_name || 'Student')}</div>` : ''}${content}<div class="message-time">${time}</div></div></div>`;
  }
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

window.sendMessage = async function() {
  if (!currentClass) { showToast("Open a chat room first", true); return; }
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  await supabaseClient.from("class_chat_messages").insert({ class_id: currentClass.class_room_id, sender_id: currentAdmin.emp_id, sender_type: 'admin', sender_name: currentAdmin.emp_name, message_type: 'text', message: msg, is_deleted: false });
  input.value = '';
};

window.uploadImage = async function() {
  if (!currentClass) { showToast("Open a chat room first", true); return; }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showToast("Uploading...");
    const fileName = `class_${currentClass.class_room_id}_${Date.now()}.${file.name.split('.').pop()}`;
    const { error } = await supabaseClient.storage.from('chat-media').upload(fileName, file);
    if (error) { showToast("Upload failed", true); return; }
    const { data: urlData } = supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
    await supabaseClient.from("class_chat_messages").insert({ class_id: currentClass.class_room_id, sender_id: currentAdmin.emp_id, sender_type: 'admin', sender_name: currentAdmin.emp_name, message_type: 'image', media_url: urlData.publicUrl, is_deleted: false });
    showToast("Image sent");
  };
  input.click();
};

window.showImagePreview = function(url) { document.getElementById('previewImage').src = url; new bootstrap.Modal(document.getElementById('imagePreviewModal')).show(); };

window.startRecording = async function() {
  if (!currentClass) { showToast("Open a chat room first", true); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const fileName = `voice_class_${currentClass.class_room_id}_${Date.now()}.webm`;
      const { error } = await supabaseClient.storage.from('chat-media').upload(fileName, audioBlob);
      if (error) { showToast("Upload failed", true); return; }
      const { data: urlData } = supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
      await supabaseClient.from("class_chat_messages").insert({ class_id: currentClass.class_room_id, sender_id: currentAdmin.emp_id, sender_type: 'admin', sender_name: currentAdmin.emp_name, message_type: 'voice', media_url: urlData.publicUrl, is_deleted: false });
      stream.getTracks().forEach(t => t.stop());
      const btn = document.getElementById('recordBtn');
      if (btn) { btn.innerHTML = '<i class="bi bi-mic-fill"></i>'; btn.classList.remove('recording-active'); }
      if (recordingTimer) clearInterval(recordingTimer);
      showToast("Voice sent");
    };
    mediaRecorder.start();
    isRecording = true;
    const btn = document.getElementById('recordBtn');
    if (btn) { btn.innerHTML = '<i class="bi bi-stop-fill"></i>'; btn.classList.add('recording-active'); }
    setTimeout(() => { if (isRecording && mediaRecorder?.state === 'recording') window.stopRecording(); }, 60000);
  } catch (err) { showToast("Microphone access denied", true); }
};

window.stopRecording = function() { if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); isRecording = false; } if (recordingTimer) clearInterval(recordingTimer); };
window.toggleRecording = function() { isRecording ? window.stopRecording() : window.startRecording(); };

window.toggleEmojiPicker = function() {
  const dd = document.getElementById('emojiDropdown');
  if (!dd) return;
  if (dd.style.display === 'none' || !dd.style.display) {
    let html = '<div class="emoji-grid">';
    for (const e of emojis) html += `<div class="emoji-item" onclick="insertEmoji('${e}')">${e}</div>`;
    html += '</div>';
    dd.innerHTML = html;
    dd.style.display = 'block';
  } else { dd.style.display = 'none'; }
};
window.insertEmoji = function(e) { const input = document.getElementById('chatInput'); if (input) { input.value += e; input.focus(); } document.getElementById('emojiDropdown').style.display = 'none'; };
document.addEventListener('click', function(e) { const dd = document.getElementById('emojiDropdown'); const btn = document.getElementById('emojiBtn'); if (dd && btn && !dd.contains(e.target) && !btn.contains(e.target)) dd.style.display = 'none'; });

window.showStudentsList = function() {
  const container = document.getElementById('studentsListModal');
  if (!container) return;
  if (allStudents.length === 0) container.innerHTML = '<div class="text-center py-4 text-muted">No students</div>';
  else {
    let html = '';
    for (const s of allStudents) {
      const initial = s.stu_name?.charAt(0).toUpperCase() || '?';
      html += `<div class="student-list-item"><div class="student-avatar-small">${initial}</div><div class="flex-grow-1"><div class="fw-bold fs-6">${escapeHtml(s.stu_name)}</div><div class="small text-muted">${escapeHtml(s.stu_admission_no)}</div></div><div><span class="online-dot online"></span><span class="small">Online</span></div></div>`;
    }
    container.innerHTML = html;
  }
  new bootstrap.Modal(document.getElementById('studentsModal')).show();
};

function renderChatWindowHeader() {
  const hc = document.getElementById('chatHeaderContainer');
  if (!hc) return;
  const cnt = selectedMessages.size;
  if (selectMode) {
    hc.innerHTML = `<div class="selection-header"><div><span class="selected-badge"><i class="bi bi-check2-square me-1"></i>${cnt} selected</span></div><div><button class="cancel-select-btn" onclick="toggleSelectMode()">Cancel</button><button class="delete-selected-btn ms-2" onclick="deleteSelectedMessages()">Delete</button></div></div>`;
  } else {
    hc.innerHTML = `<div class="card-header-custom"><div><button class="back-btn" onclick="goBack()"><i class="bi bi-arrow-left"></i> Back</button><span class="ms-2 fw-medium">${escapeHtml(currentClass?.class_room_no || 'Chat')}</span></div><div class="d-flex gap-1"><button class="clear-all-btn" onclick="clearAllMessages()"><i class="bi bi-trash3"></i> Clear</button><button class="select-mode-btn" onclick="toggleSelectMode()"><i class="bi bi-check2-square"></i> Sel</button><button class="students-btn" onclick="showStudentsList()"><i class="bi bi-people-fill"></i></button></div></div>`;
  }
}

function renderChatWindow() {
  const container = document.getElementById('appContainer');
  container.innerHTML = `<div class="card-custom"><div id="chatHeaderContainer"></div><div class="chat-messages" id="chatMessages"></div><div class="chat-input-area"><button class="chat-btn" id="emojiBtn" onclick="toggleEmojiPicker()">😊</button><div id="emojiDropdown" class="emoji-dropdown"></div><button class="chat-btn" onclick="uploadImage()">📸</button><button class="chat-btn" id="recordBtn" onclick="toggleRecording()"><i class="bi bi-mic-fill"></i></button><input type="text" id="chatInput" class="chat-input" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMessage()"><button class="chat-btn send-btn" onclick="sendMessage()">Send</button></div></div>`;
  renderChatWindowHeader();
  renderMessages();
  setTimeout(() => document.getElementById('chatInput')?.focus(), 100);
}

async function init() { 
  await loadClasses(); 
  await showClassesList();
  // Refresh class list every 5 seconds to update unread counts
  setInterval(async () => {
    if (!currentClass) {
      await showClassesList();
    }
  }, 5000);
}

window.goBack = goBack;
window.toggleSelectMode = toggleSelectMode;
window.toggleSelectMessage = toggleSelectMessage;
window.deleteSelectedMessages = deleteSelectedMessages;
window.toggleEmojiPicker = toggleEmojiPicker;
window.insertEmoji = insertEmoji;
window.showStudentsList = showStudentsList;
window.openChatRoom = openChatRoom;
window.uploadImage = uploadImage;
window.toggleRecording = toggleRecording;
window.showImagePreview = showImagePreview;
window.sendMessage = sendMessage;
window.clearAllMessages = clearAllMessages;

init();
</script>
