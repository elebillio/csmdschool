<script>
const supabaseUrl = "https://tqcfcztyvmedmuhohpps.supabase.co";
const supabaseKey = "sb_publishable_mnk4CySLaCI-FwtKJ9DhMg_z852ATHH";
const supabase1 = window.supabase.createClient(supabaseUrl, supabaseKey);

let currentStudent = null;
let allClassrooms = [];
let allFees = [];
let allExamResults = [];
let siblingStudents = [];
let announcements = [];
let selectedSibling = null;
let onlineHeartbeatInterval = null;

function showToast(message) {
  const toast = document.getElementById('toastMsg');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
}

function getClassroomName(classroomId) {
  const classroom = allClassrooms.find(c => c.class_room_id == classroomId);
  return classroom ? classroom.class_room_no : `Class ${classroomId}`;
}

function getStudentImageUrl(student) {
  if (student.stu_image && typeof student.stu_image === 'string' && student.stu_image.length > 10) {
    if (student.stu_image.startsWith('data:image') || student.stu_image.startsWith('http')) {
      return student.stu_image;
    }
    return `data:image/jpeg;base64,${student.stu_image}`;
  }
  return null;
}

// ==================== ANNOUNCEMENTS FROM DATABASE ====================
async function loadAnnouncementsFromDB() {
  try {
    const { data, error } = await supabase1
      .from("announcements")
      .select("*")
      .order("id", { ascending: true });
    
    if (error) {
      console.error("Error loading from DB:", error);
      setDefaultAnnouncements();
      renderTicker();
      return;
    }
    
    if (data && data.length > 0) {
      announcements = data.map(a => ({
        id: a.id,
        icon: a.icon || "bi-megaphone-fill",
        text: a.message
      }));
    } else {
      setDefaultAnnouncements();
    }
    renderTicker();
  } catch (error) {
    console.error("Error loading announcements:", error);
    setDefaultAnnouncements();
    renderTicker();
  }
}

function setDefaultAnnouncements() {
  announcements = [
    { id: null, icon: "bi-calendar-event", text: "Annual Examination 2025 will start from 1st June 2025" },
    { id: null, icon: "bi-trophy", text: "Summer Vacation from 15th June to 31st July 2025" },
    { id: null, icon: "bi-cash-stack", text: "Fee submission deadline: 10th of every month" },
    { id: null, icon: "bi-person-plus", text: "New Admissions open for Session 2025-2026" },
    { id: null, icon: "bi-journal-bookmark-fill", text: "Syllabus for Mid-Term Exam has been uploaded" },
    { id: null, icon: "bi-calendar-check", text: "Parent-Teacher Meeting on 25th May 2025" }
  ];
}

function renderTicker() {
  const tickerContainer = document.getElementById('tickerText');
  if (!tickerContainer) return;
  
  if (announcements.length === 0) {
    tickerContainer.innerHTML = '<span>No announcements available</span>';
    return;
  }
  
  const allAnnouncements = [...announcements, ...announcements];
  let html = '';
  for (const ann of allAnnouncements) {
    html += `<span><i class="bi ${ann.icon}"></i> ${escapeHtml(ann.text)}</span>`;
  }
  tickerContainer.innerHTML = html;
}

// ==================== ONLINE STATUS FUNCTIONS ====================
async function updateOnlineStatus(isOnline) {
  if (!currentStudent) return;
  try {
    const { data: existing } = await supabase1
      .from("student_online_status")
      .select("id")
      .eq("student_id", currentStudent.stu_id)
      .single();
    
    if (existing) {
      await supabase1
        .from("student_online_status")
        .update({ is_online: isOnline, last_seen: new Date().toISOString() })
        .eq("student_id", currentStudent.stu_id);
    } else {
      await supabase1
        .from("student_online_status")
        .insert({ student_id: currentStudent.stu_id, is_online: isOnline, last_seen: new Date().toISOString() });
    }
  } catch(e) { console.error("Online status error:", e); }
}

function startOnlineHeartbeat() {
  if (onlineHeartbeatInterval) clearInterval(onlineHeartbeatInterval);
  onlineHeartbeatInterval = setInterval(async () => {
    if (currentStudent) {
      await updateOnlineStatus(true);
    }
  }, 30000);
}

async function loadSiblingStudents() {
  if (!currentStudent) return [];
  
  let query = supabase1.from("students").select("*").neq("stu_id", currentStudent.stu_id);
  
  if (currentStudent.stu_family_group && currentStudent.stu_family_group !== '') {
    query = query.eq("stu_family_group", currentStudent.stu_family_group);
  } 
  else if (currentStudent.stu_father && currentStudent.stu_father !== '') {
    query = query.ilike("stu_father", currentStudent.stu_father);
  } else {
    return [];
  }
  
  const { data, error } = await query;
  if (!error && data && data.length > 0) {
    siblingStudents = data;
    return siblingStudents;
  }
  return [];
}

async function recordLoginHistory(student) {
  try {
    let ip = "Unknown";
    try {
      const ipRes = await fetch('https://api.ipify.org?format=json');
      const ipData = await ipRes.json();
      ip = ipData.ip;
    } catch(e) {}
    const userAgent = navigator.userAgent;
    let deviceType = "Unknown";
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(userAgent)) deviceType = "Mobile";
    else if (/Tablet|iPad/i.test(userAgent)) deviceType = "Tablet";
    else deviceType = "Desktop";
    const loginDate = new Date().toISOString().split('T')[0];
    await supabase1.from("student_login_history").insert({
      student_id: student.stu_id, student_name: student.stu_name,
      student_admission_no: student.stu_admission_no, login_time: new Date().toISOString(),
      login_date: loginDate, ip_address: ip, user_agent: userAgent.substring(0, 255), device_type: deviceType
    });
  } catch(e) { console.error("Failed to record login history:", e); }
}

async function studentLogin() {
  const admissionNo = document.getElementById('loginAdmission').value.trim();
  const password = document.getElementById('loginPassword').value.trim();

  if (!admissionNo || !password) {
    alert("Please enter Admission Number and Password");
    return;
  }

  const { data, error } = await supabase1
    .from("students")
    .select("*")
    .eq("stu_admission_no", admissionNo)
    .eq("stu_password", password)
    .single();

  if (error || !data) {
    alert("Invalid Admission Number or Password");
    return;
  }

  currentStudent = data;
  
  const sessionData = {
    student: currentStudent,
    timestamp: Date.now(),
    studentId: currentStudent.stu_id
  };
  localStorage.setItem('studentLoggedIn', JSON.stringify(sessionData));
  localStorage.setItem('currentStudent', JSON.stringify(currentStudent));
  
  await recordLoginHistory(currentStudent);
  await updateOnlineStatus(true);
  startOnlineHeartbeat();
  
  await loadMasterData();
  await loadSiblingStudents();
  selectedSibling = null;
  showDashboard();
}

function doLogout() {
  if (currentStudent) {
    updateOnlineStatus(false);
  }
  if (onlineHeartbeatInterval) {
    clearInterval(onlineHeartbeatInterval);
    onlineHeartbeatInterval = null;
  }
  
  currentStudent = null;
  siblingStudents = [];
  selectedSibling = null;
  localStorage.removeItem('studentLoggedIn');
  localStorage.removeItem('currentStudent');
  
  const iframeContainer = document.getElementById('iframeContainer');
  if (iframeContainer) iframeContainer.style.display = 'none';
  
  document.getElementById('dashboardView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  
  document.getElementById('loginAdmission').value = '';
  document.getElementById('loginPassword').value = '';
  
  const floatingBtn = document.getElementById('floatingBackBtn');
  if (floatingBtn) floatingBtn.style.display = 'none';
  closeModal();
  
  showToast("Logged out successfully");
}

async function loadMasterData() {
  if (!currentStudent) return;
  
  const [classrooms, fees, examResults] = await Promise.all([
    supabase1.from("class_rooms").select("*"),
    supabase1.from("student_pay_scale").select("*").eq("stu_id", currentStudent.stu_id),
    supabase1.from("examinations").select("*").eq("stu_id", currentStudent.stu_id)
  ]);
  
  if (classrooms.data) allClassrooms = classrooms.data;
  if (fees.data) allFees = fees.data;
  if (examResults.data) allExamResults = examResults.data;
}

function openModuleForStudent(pageName, studentId) {
  if (!studentId) return;
  localStorage.setItem('currentStudent', JSON.stringify(currentStudent));
  const iframeContainer = document.getElementById('iframeContainer');
  const iframe = document.getElementById('moduleIframe');
  if (!iframeContainer || !iframe) return;
  iframe.src = `${pageName}.html?stu_id=${studentId}&viewer_id=${currentStudent.stu_id}&fromStudentPortal=true`;
  iframeContainer.style.display = 'flex';
  document.getElementById('dashboardView').style.display = 'none';
  const floatingBtn = document.getElementById('floatingBackBtn');
  if (floatingBtn) floatingBtn.style.display = 'flex';
  closeModal();
}

function selectSibling(sibling) {
  selectedSibling = sibling;
  showDashboard();
  setTimeout(() => {
    openModal();
  }, 100);
}

function openModal() {
  if (!selectedSibling) {
    showToast("Please select a sibling first");
    return;
  }
  const modal = document.getElementById('actionModal');
  const infoDiv = document.getElementById('selectedSiblingInfo');
  if (infoDiv) {
    infoDiv.innerHTML = `<i class="bi bi-person-circle me-1"></i> Actions for ${escapeHtml(selectedSibling.stu_name)}`;
  }
  if (modal) modal.classList.add('show');
}

function closeModal() {
  const modal = document.getElementById('actionModal');
  if (modal) modal.classList.remove('show');
}

function modalAction(action) {
  if (!selectedSibling) {
    closeModal();
    showToast("Please select a sibling first");
    return;
  }
  
  switch(action) {
    case 'attendance':
      openModuleForStudent('stuattendance', selectedSibling.stu_id);
      break;
    case 'syllabus':
      openModuleForStudent('stusyllabus', selectedSibling.stu_id);
      break;
    case 'result':
      openModuleForStudent('sturesult', selectedSibling.stu_id);
      break;
    case 'chat':
      openSiblingChat(selectedSibling.stu_id, selectedSibling.stu_name);
      break;
    case 'profile':
      showStudentProfileById(selectedSibling.stu_id);
      break;
  }
  closeModal();
}

        <div class="col-6"><small>📞 Mobile</small><br><strong>${currentStudent.stu_mobile1 || 'N/A'}</strong></div>
      </div>
    </div>
    
    ${siblingsHtml}
    
    <div class="stats-row">
      <div class="stat-card">
        <i class="bi bi-cash-stack text-warning"></i>

        <p>Fee Due</p>
      </div>
      <div class="stat-card">

function closeIframe() {

  if (iframeContainer) iframeContainer.style.display = 'none';
  document.getElementById('dashboardView').style.display = 'block';
  const floatingBtn = document.getElementById('floatingBackBtn');
  if (floatingBtn) floatingBtn.style.display = 'none';
  if (currentStudent) { loadMasterData(); showDashboard(); }
}

async function restoreSession() {
  const savedSession = localStorage.getItem('studentLoggedIn');
  const savedStudent = localStorage.getItem('currentStudent');
  const urlParams = new URLSearchParams(window.location.search);
  const urlStudentId = urlParams.get('stu_id');
  
  if (urlStudentId && !currentStudent) {
    const { data, error } = await supabase1.from("students").select("*").eq("stu_id", urlStudentId).single();
    if (!error && data) {
      currentStudent = data;
      localStorage.setItem('currentStudent', JSON.stringify(currentStudent));
      await loadMasterData();
      await loadSiblingStudents();
      selectedSibling = null;
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      showDashboard();
      return true;
    }
  }
  
  if (savedSession) {
    try {
      const sessionData = JSON.parse(savedSession);
      let studentData = sessionData.student || sessionData;
      if (studentData && studentData.stu_id) {
        const { data, error } = await supabase1.from("students").select("*").eq("stu_id", studentData.stu_id).single();
        if (!error && data) {
          currentStudent = data;
          await loadMasterData();
          await loadSiblingStudents();
          selectedSibling = null;
          document.getElementById('loginView').style.display = 'none';
          document.getElementById('dashboardView').style.display = 'block';
          showDashboard();
          return true;
        } else { localStorage.removeItem('studentLoggedIn'); localStorage.removeItem('currentStudent'); }
      }
    } catch(e) { console.error("Session restore error:", e); }
  }
  
  if (savedStudent && !currentStudent) {
    try {
      const studentData = JSON.parse(savedStudent);
      if (studentData && studentData.stu_id) {
        const { data, error } = await supabase1.from("students").select("*").eq("stu_id", studentData.stu_id).single();
        if (!error && data) {
          currentStudent = data;
          await loadMasterData();
          await loadSiblingStudents();
          selectedSibling = null;
          document.getElementById('loginView').style.display = 'none';
          document.getElementById('dashboardView').style.display = 'block';
          showDashboard();
          return true;
        }
      }
    } catch(e) {}
  }
  
  document.getElementById('dashboardView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  const floatingBtn = document.getElementById('floatingBackBtn');
  if (floatingBtn) floatingBtn.style.display = 'none';
  return false;
}

// Close modal when clicking outside
document.addEventListener('click', function(e) {
  const modal = document.getElementById('actionModal');
  const modalContent = document.querySelector('.modal-content-custom');
  if (modal && modal.classList.contains('show') && modalContent && !modalContent.contains(e.target)) {
    closeModal();
  }
});

// Set online status to false when page is closed
window.addEventListener('beforeunload', async () => {
  if (currentStudent) {
    await updateOnlineStatus(false);
  }
});

window.addEventListener('pageshow', async function(event) {
  const iframeContainer = document.getElementById('iframeContainer');
  if (iframeContainer && iframeContainer.style.display === 'flex') {
    const floatingBtn = document.getElementById('floatingBackBtn');
    if (floatingBtn) floatingBtn.style.display = 'flex';
  } else if (currentStudent) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashboardView').style.display = 'block';
    const floatingBtn = document.getElementById('floatingBackBtn');
    if (floatingBtn) floatingBtn.style.display = 'none';
    showDashboard();
    updateOnlineStatus(true);
  } else { await restoreSession(); }
});

window.onload = function() {
  loadAnnouncementsFromDB();
  restoreSession().then(() => {
    const loginBtn = document.getElementById('loginBtn');
    if (loginBtn) loginBtn.onclick = studentLogin;
    const floatingBtn = document.getElementById('floatingBackBtn');
    if (floatingBtn) floatingBtn.onclick = closeIframe;
  });
};

window.doLogout = doLogout;
window.openModuleForStudent = openModuleForStudent;
window.openSiblingChat = openSiblingChat;
window.openModule = openModule;
window.showProfile = showProfile;
window.showStudentProfileById = showStudentProfileById;
window.closeIframe = closeIframe;
window.showDashboard = showDashboard;
window.selectSibling = selectSibling;
window.openModal = openModal;
window.closeModal = closeModal;
window.modalAction = modalAction;
</script>
