<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"/>
<title>Class Chat | Student Portal</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { background: #f0f4f8; }
  .app-container { max-width: 550px; margin: 0 auto; padding: 12px; height: 100vh; display: flex; flex-direction: column; }
  
  .card-custom {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    height: 100%;
    max-height: calc(100vh - 24px);
  }
  .card-header-custom {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    padding: 12px 16px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .back-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 20px;
    padding: 5px 10px;
    color: white;
    font-size: 0.7rem;
    cursor: pointer;
  }
  .back-btn:hover { background: rgba(255,255,255,0.25); }
  
  .room-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .sibling-view-badge {
    background: #ec489a;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 0.6rem;
  }
  
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: #f8fafc;
  }
  .message {
    margin-bottom: 10px;
    display: flex;
  }
  .message.sent { justify-content: flex-end; }
  .message.received { justify-content: flex-start; }
  .message-bubble {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 18px;
    font-size: 0.8rem;
  }
  .message.sent .message-bubble {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.received .message-bubble {
    background: white;
    color: #1e293b;
    border: 1px solid #eef2f8;
    border-bottom-left-radius: 4px;
  }
  .message-sender {
    font-size: 0.6rem;
    font-weight: 600;
    margin-bottom: 2px;
    color: #64748b;
  }
  .message-time {
    font-size: 0.5rem;
    margin-top: 3px;
    opacity: 0.6;
  }
  
  .voice-message audio { height: 32px; max-width: 180px; border-radius: 16px; }
  .chat-image { max-width: 180px; border-radius: 12px; cursor: pointer; }
  
  .chat-input-area {
    display: flex;
    gap: 6px;
    padding: 10px 12px;
    background: white;
    border-top: 1px solid #eef2f8;
    align-items: center;
    flex-shrink: 0;
    position: relative;
  }
  .chat-input {
    flex: 1;
    border: 1px solid #e2e8f0;
    border-radius: 24px;
    padding: 8px 14px;
    font-size: 0.85rem;
    outline: none;
    background: #f8fafc;
  }
  .chat-input:focus { border-color: #1e3c72; background: white; }
  .chat-btn {
    background: #f1f5f9;
    border: none;
    border-radius: 24px;
    padding: 7px 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1rem;
  }
  .chat-btn:hover { background: #e2e8f0; }
  .send-btn {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    padding: 7px 16px;
  }
  
  .recording-active {
    background: #ef4444;
    color: white;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  
  .emoji-dropdown {
    position: absolute;
    bottom: 65px;
    left: 10px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    padding: 8px;
    display: none;
    z-index: 1000;
    width: 260px;
    max-height: 280px;
    overflow-y: auto;
  }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .emoji-item {
    font-size: 1.2rem;
    cursor: pointer;
    text-align: center;
    padding: 4px;
    border-radius: 8px;
  }
  .emoji-item:hover { background: #f1f5f9; }
  
  .image-preview-modal {
    max-width: 90vw;
    max-height: 90vh;
  }
  .image-preview-modal img { width: 100%; height: auto; }
  
  .class-info {
    background: #f1f5f9;
    padding: 6px 12px;
    font-size: 0.65rem;
    color: #475569;
    text-align: center;
    border-bottom: 1px solid #eef2f8;
    flex-shrink: 0;
  }
  
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #94a3b8;
  }
  
  #customToast {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 0.7rem;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="app-container" id="appContainer"></div>

<!-- Image Preview Modal -->
<div class="modal fade" id="imagePreviewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered image-preview-modal">
    <div class="modal-content bg-transparent border-0">
      <div class="text-end mb-2">
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <img id="previewImage" src="" class="rounded-3">
    </div>
  </div>
</div>

<script>
// Supabase configuration
const SUPABASE_URL = "https://tqcfcztyvmedmuhohpps.supabase.co";
const SUPABASE_KEY = "sb_publishable_mnk4CySLaCI-FwtKJ9DhMg_z852ATHH";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentStudent = null;
let currentClass = null;
let currentMessages = [];
let messageSubscription = null;
let allClassrooms = [];
let siblingName = "";
let isSiblingView = false;
let siblingStudentId = null;

// Voice Recording Variables
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordingTimer = null;

// Emojis list
const emojis = ["😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🥰","😍","🤩","😘","😗","😚","😙","🥲","😋","😛","😜","🤪","😝","🤑","🤗","🤭","🤫","🤔","🤐","🤨","😐","😑","😶","😏","😒","🙄","😬","😌","😔","😪","🤤","😴","😷","🤒","🤕","🥳","😎","🤓","🧐","😕","😟","🙁","☹️","😮","😯","😲","😳","🥺","😢","😭","😱","😖","😣","😞","😓","😩","😫","🥱","😤","😡","😠","🤬","😈","👿","💀","☠️","💩","🤡","👻","👽","🤖","😺","😸","😹","😻","😼","😽","🙀","😿","😾","🙈","🙉","🙊","💋","💌","💘","💝","💖","💗","💓","💞","💕","💔","❤️","🧡","💛","💚","💙","💜","🤎","🖤","🤍","💯","💢","💥","💫","💦","💨","💣","💬","👋","🤚","🖐️","✋","🖖","👌","🤏","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","🖕","👇","☝️","👍","👎","✊","👊","🤛","🤜","👏","🙌","👐","🤲","🤝","🙏","✍️","💅","🤳","💪","🦵","🦶","👂","👃","🧠","🦷","🦴","👀","👅","👄","🔥","✨","⭐","✅","🎉"];

function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
function formatTime(date) { return new Date(date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

function showToast(msg, isErr = false) {
  let toast = document.getElementById('customToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'customToast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.background = isErr ? '#ef4444' : '#333';
  toast.style.opacity = '1';
  setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}

function goBack() {
  if (window.parent && window.parent !== window && typeof window.parent.closeIframe === 'function') {
    window.parent.closeIframe();
  } else {
    window.location.href = 'index.html';
  }
}

function getClassroomName(classroomId) {
  const classroom = allClassrooms.find(c => c.class_room_id == classroomId);
  return classroom ? classroom.class_room_no : `Class ${classroomId}`;
}

async function ensureChatRoomExists(classId, className) {
  const { data: existing } = await supabaseClient.from("chat_rooms").select("*").eq("class_room_id", classId).eq("is_active", true);
  if (existing && existing.length > 0) return existing[0];
  const { data: newRoom } = await supabaseClient.from("chat_rooms").insert({
    class_room_id: classId, room_name: `${className} Chat Room`,
    room_description: `Chat room for ${className}`, created_by: 1, is_active: true
  }).select();
  return newRoom?.[0] || null;
}

async function loadStudentData() {
  const urlParams = new URLSearchParams(window.location.search);
  const targetId = urlParams.get('stu_id');
  const viewerId = urlParams.get('viewer_id');
  const sibName = urlParams.get('sibling_name');
  
  if (sibName) { siblingName = decodeURIComponent(sibName); isSiblingView = true; }
  if (targetId && targetId !== 'null') { siblingStudentId = targetId; isSiblingView = true; }
  
  if (viewerId && viewerId !== 'null') {
    const { data } = await supabaseClient.from("students").select("*").eq("stu_id", viewerId).single();
    if (data) currentStudent = data;
  }
  if (!currentStudent) {
    const saved = localStorage.getItem('currentStudent');
    if (saved) try { currentStudent = JSON.parse(saved); } catch(e) {}
  }
  if (!currentStudent) {
    const savedLogin = localStorage.getItem('studentLoggedIn');
    if (savedLogin) try { currentStudent = JSON.parse(savedLogin).student || JSON.parse(savedLogin); } catch(e) {}
  }
  
  if (siblingStudentId && !siblingName) {
    const { data } = await supabaseClient.from("students").select("stu_name").eq("stu_id", siblingStudentId).single();
    if (data) siblingName = data.stu_name;
  }
  
  let targetStudent = currentStudent;
  if (isSiblingView && siblingStudentId) {
    const { data } = await supabaseClient.from("students").select("*").eq("stu_id", siblingStudentId).single();
    if (data) { targetStudent = data; if (!siblingName) siblingName = data.stu_name; }
  }
  
  if (!currentStudent) { showToast("Session expired", true); setTimeout(goBack, 1500); return false; }
  
  const { data: classrooms } = await supabaseClient.from("class_rooms").select("*");
  if (classrooms) allClassrooms = classrooms;
  await loadChatRoom(targetStudent);
  return true;
}

async function loadChatRoom(student) {
  if (!student) return;
  const classId = student.stu_class_room_id;
  const className = getClassroomName(classId);
  const chatRoom = await ensureChatRoomExists(classId, className);
  if (!chatRoom) { renderNoChatRoom(student); return; }
  
  currentClass = chatRoom;
  if (messageSubscription) await supabaseClient.removeChannel(messageSubscription);
  messageSubscription = supabaseClient.channel(`class_chat_${currentClass.id}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'class_chat_messages', filter: `class_id=eq.${currentClass.class_room_id}` },
      (p) => { currentMessages.push(p.new); renderMessages(); })
    .subscribe();
  
  const { data } = await supabaseClient.from("class_chat_messages").select("*").eq("class_id", currentClass.class_room_id).order("created_at", { ascending: true });
  if (data) currentMessages = data;
  renderChatWindow(student);
}

function renderMessages() {
  const container = document.getElementById('chatMessages');
  if (!container) return;
  let html = '';
  for (const msg of currentMessages) {
    const isSent = msg.sender_type === 'student' && msg.sender_id === currentStudent.stu_id;
    const time = formatTime(msg.created_at);
    let content = '';
    if (msg.message_type === 'image') content = `<img src="${msg.media_url}" class="chat-image" onclick="showImagePreview('${msg.media_url}')">`;
    else if (msg.message_type === 'voice') content = `<div class="voice-message"><audio controls src="${msg.media_url}"></audio></div>`;
    else content = escapeHtml(msg.message);
    
    let sender = '';
    if (!isSent) {
      if (msg.sender_type === 'admin') sender = '<div class="message-sender">Admin</div>';
      else if (msg.sender_type === 'student') {
        if (isSiblingView && siblingStudentId && msg.sender_id == siblingStudentId) sender = `<div class="message-sender">${escapeHtml(siblingName)}</div>`;
        else if (msg.sender_id !== currentStudent.stu_id) sender = `<div class="message-sender">${escapeHtml(msg.sender_name || 'Student')}</div>`;
      }
    }
    html += `<div class="message ${isSent ? 'sent' : 'received'}"><div class="message-bubble">${sender}${content}<div class="message-time">${time}</div></div></div>`;
  }
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg || !currentClass) return;
  let sName = currentStudent.stu_name, sId = currentStudent.stu_id;
  if (isSiblingView && siblingStudentId) { sName = siblingName; sId = siblingStudentId; }
  await supabaseClient.from("class_chat_messages").insert({
    class_id: currentClass.class_room_id, sender_id: sId, sender_type: 'student',
    sender_name: sName, message_type: 'text', message: msg
  });
  input.value = '';
}

async function startRecording() {
  if (!currentClass) { showToast("Chat room loading...", true); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const fileName = `voice_student_${currentStudent.stu_id}_${Date.now()}.webm`;
      showToast("Uploading...");
      const { error } = await supabaseClient.storage.from('chat-media').upload(fileName, audioBlob);
      if (error) { showToast("Upload failed", true); stream.getTracks().forEach(t => t.stop()); return; }
      const { data: urlData } = supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
      let sName = currentStudent.stu_name, sId = currentStudent.stu_id;
      if (isSiblingView && siblingStudentId) { sName = siblingName; sId = siblingStudentId; }
      await supabaseClient.from("class_chat_messages").insert({
        class_id: currentClass.class_room_id, sender_id: sId, sender_type: 'student',
        sender_name: sName, message_type: 'voice', media_url: urlData.publicUrl
      });
      stream.getTracks().forEach(t => t.stop());
      const btn = document.getElementById('recordBtn');
      if (btn) { btn.innerHTML = '<i class="bi bi-mic-fill"></i>'; btn.classList.remove('recording-active'); }
      if (recordingTimer) clearInterval(recordingTimer);
      showToast("Voice sent");
    };
    mediaRecorder.start();
    isRecording = true;
    const btn = document.getElementById('recordBtn');
    if (btn) { btn.innerHTML = '<i class="bi bi-stop-fill"></i>'; btn.classList.add('recording-active'); }
    setTimeout(() => { if (isRecording && mediaRecorder?.state === 'recording') stopRecording(); }, 60000);
  } catch (err) { showToast("Microphone access denied", true); }
}
function stopRecording() { if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); isRecording = false; } if (recordingTimer) clearInterval(recordingTimer); }
function toggleRecording() { isRecording ? stopRecording() : startRecording(); }

window.uploadImage = async function() {
  if (!currentClass) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showToast("Uploading...");
    const fileName = `student_${currentStudent.stu_id}_${Date.now()}.${file.name.split('.').pop()}`;
    const { error } = await supabaseClient.storage.from('chat-media').upload(fileName, file);
    if (error) { showToast("Upload failed", true); return; }
    const { data: urlData } = supabaseClient.storage.from('chat-media').getPublicUrl(fileName);
    let sName = currentStudent.stu_name, sId = currentStudent.stu_id;
    if (isSiblingView && siblingStudentId) { sName = siblingName; sId = siblingStudentId; }
    await supabaseClient.from("class_chat_messages").insert({
      class_id: currentClass.class_room_id, sender_id: sId, sender_type: 'student',
      sender_name: sName, message_type: 'image', media_url: urlData.publicUrl
    });
    showToast("Image sent");
  };
  input.click();
};

window.showImagePreview = function(url) { document.getElementById('previewImage').src = url; new bootstrap.Modal(document.getElementById('imagePreviewModal')).show(); };

function renderChatWindow(student) {
  const container = document.getElementById('appContainer');
  const className = getClassroomName(student.stu_class_room_id);
  let header = `${escapeHtml(className)} Chat Room`;
  let info = `<i class="bi bi-chat-dots-fill me-1"></i> Connected to your class chat`;
  if (isSiblingView && siblingName) {
    header = `Chat with ${escapeHtml(siblingName)} (${escapeHtml(className)})`;
    info = `<i class="bi bi-people-fill me-1"></i> Viewing ${escapeHtml(siblingName)}'s class`;
  }
  container.innerHTML = `<div class="card-custom"><div class="card-header-custom"><button class="back-btn" onclick="goBack()"><i class="bi bi-arrow-left"></i> Back</button><div class="room-title"><i class="bi bi-chat-dots-fill"></i><span>${escapeHtml(header)}</span></div>${isSiblingView ? '<span class="sibling-view-badge"><i class="bi bi-eye-fill"></i> Viewing</span>' : ''}</div><div class="class-info">${info}</div><div class="chat-messages" id="chatMessages"></div><div class="chat-input-area"><button class="chat-btn" id="emojiBtn" onclick="toggleEmojiPicker()">😊</button><div id="emojiDropdown" class="emoji-dropdown"></div><button class="chat-btn" onclick="uploadImage()">📸</button><button class="chat-btn" id="recordBtn" onclick="toggleRecording()"><i class="bi bi-mic-fill"></i></button><input type="text" id="chatInput" class="chat-input" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMessage()"><button class="chat-btn send-btn" onclick="sendMessage()">Send</button></div></div>`;
  renderMessages();
  setTimeout(() => document.getElementById('chatInput')?.focus(), 100);
}

function renderNoChatRoom(student) {
  const className = getClassroomName(student.stu_class_room_id);
  document.getElementById('appContainer').innerHTML = `<div class="card-custom"><div class="card-header-custom"><button class="back-btn" onclick="goBack()"><i class="bi bi-arrow-left"></i> Back</button><h5 class="mb-0 fs-6"><i class="bi bi-chat-dots-fill me-2"></i>${escapeHtml(className)} Chat</h5><div style="width:50px;"></div></div><div class="empty-state"><i class="bi bi-chat-square-text" style="font-size:2.5rem;"></i><p class="mt-2">No chat room available</p><small>Contact admin</small></div></div>`;
}

function buildEmojiGrid() {
  let html = '<div class="emoji-grid">';
  for (const e of emojis) html += `<div class="emoji-item" onclick="insertEmoji('${e}')">${e}</div>`;
  return html + '</div>';
}

window.toggleEmojiPicker = function() {
  const dd = document.getElementById('emojiDropdown');
  if (!dd) return;
  if (dd.style.display === 'none' || !dd.style.display) {
    dd.innerHTML = buildEmojiGrid();
    dd.style.display = 'block';
  } else dd.style.display = 'none';
};
window.insertEmoji = function(e) { const input = document.getElementById('chatInput'); if (input) { input.value += e; input.focus(); } document.getElementById('emojiDropdown').style.display = 'none'; };
document.addEventListener('click', function(e) { const dd = document.getElementById('emojiDropdown'); const btn = document.getElementById('emojiBtn'); if (dd && btn && !dd.contains(e.target) && !btn.contains(e.target)) dd.style.display = 'none'; });

async function init() { await loadStudentData(); }

window.goBack = goBack;
window.sendMessage = sendMessage;
window.uploadImage = uploadImage;
window.toggleRecording = toggleRecording;
window.toggleEmojiPicker = toggleEmojiPicker;
window.insertEmoji = insertEmoji;
window.showImagePreview = showImagePreview;

init();
</script>
</body>
</html>
