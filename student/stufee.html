<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"/>
<title>My Fee | Student Portal</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { font-family: system-ui, sans-serif; }
  body { background: #f0f4f8; padding: 16px; margin: 0; }
  .app-container { max-width: 550px; margin: 0 auto; }
  .detail-card { background: white; border-radius: 24px; overflow: hidden; margin-bottom: 16px; }
  .detail-header { background: linear-gradient(135deg, #1e3c72, #2a5298); padding: 20px; color: white; display: flex; align-items: center; gap: 16px; }
  .back-btn { background: transparent; border: none; color: white; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .info-row { display: flex; padding: 12px 20px; border-bottom: 1px solid #eef2f8; }
  .info-label { width: 40%; font-weight: 700; font-size: 0.75rem; color: #475569; }
  .info-value { width: 60%; font-size: 0.85rem; color: #0f172a; }
  .fee-row { display: flex; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #eef2f8; }
  .status-paid { color: #10b981; font-weight: 600; }
  .status-due { color: #ef4444; font-weight: 600; }
  .toast-custom { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.8rem; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast-custom.show { opacity: 1; }
</style>
</head>
<body>

<div class="app-container" id="appContainer"></div>
<div id="toastMsg" class="toast-custom"></div>

<script>
const supabaseUrl = "https://tqcfcztyvmedmuhohpps.supabase.co";
const supabaseKey = "sb_publishable_mnk4CySLaCI-FwtKJ9DhMg_z852ATHH";
const supabase1 = window.supabase.createClient(supabaseUrl, supabaseKey);

let currentStudent = null;
let allFees = [];
let allClassrooms = [];

function showToast(message) {
  const toast = document.getElementById('toastMsg');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => m==='&'?'&amp;':(m==='<'?'&lt;':'&gt;')); }

function getClassroomName(classroomId) {
  const classroom = allClassrooms.find(c => c.class_room_id == classroomId);
  return classroom ? classroom.class_room_no : `Class ${classroomId}`;
}

async function loadData() {
  const saved = localStorage.getItem('currentStudent');
  if(saved) {
    currentStudent = JSON.parse(saved);
  } else {
    const savedLogin = localStorage.getItem('studentLoggedIn');
    if(savedLogin) currentStudent = JSON.parse(savedLogin);
  }
  
  if(!currentStudent) {
    window.location.href = 'index.html';
    return;
  }
  
  const [classrooms, fees] = await Promise.all([
    supabase1.from("class_rooms").select("*"),
    supabase1.from("student_pay_scale").select("*").eq("stu_id", currentStudent.stu_id)
  ]);
  
  if(classrooms.data) allClassrooms = classrooms.data;
  if(fees.data) allFees = fees.data;
  
  renderFeePage();
}

function goBack() {
  window.location.href = 'index.html';
}

function renderFeePage() {
  const container = document.getElementById('appContainer');
  
  const totalFee = allFees.reduce((sum, f) => sum + (Number(f.stu_total) || 0), 0);
  const paidFee = allFees.reduce((sum, f) => sum + (Number(f.stu_paid) || 0), 0);
  const dueFee = totalFee - paidFee;
  
  let feeHtml = `
    <div class="detail-card">
      <div class="detail-header">
        <button class="back-btn" onclick="goBack()"><i class="bi bi-arrow-left"></i> Back</button>
        <h5 class="mb-0">💰 Fee Details</h5>
        <div></div>
      </div>
      <div class="p-3">
        <div class="bg-light p-3 rounded-3 mb-3 text-center">
          <h3 class="text-danger mb-0">PKR ${dueFee.toLocaleString()}</h3>
          <small>Total Due</small>
        </div>
        <div class="row mb-3">
          <div class="col-6 text-center"><h5>PKR ${totalFee.toLocaleString()}</h5><small>Total Fee</small></div>
          <div class="col-6 text-center"><h5 class="text-success">PKR ${paidFee.toLocaleString()}</h5><small>Paid</small></div>
        </div>
  `;
  
  if(allFees.length === 0) {
    feeHtml += '<div class="text-center py-4 text-muted">No fee records found</div>';
  } else {
    feeHtml += `<div class="mt-3"><h6 class="fw-bold">📋 Payment History</h6>`;
    for(const f of allFees) {
      const status = f.stu_due === 0 ? 'Paid' : (f.stu_paid > 0 ? 'Partial' : 'Unpaid');
      const statusClass = f.stu_due === 0 ? 'status-paid' : 'status-due';
      feeHtml += `<div class="fee-row">
        <div><small>${f.stu_invoice || 'N/A'}</small><br><small class="text-muted">${f.stu_issu_date || '—'}</small></div>
        <div class="text-end"><strong>PKR ${(f.stu_paid || 0).toLocaleString()}</strong><br><small class="${statusClass}">${status}</small></div>
      </div>`;
    }
    feeHtml += `</div>`;
  }
  
  feeHtml += `</div></div>`;
  container.innerHTML = feeHtml;
}

loadData();
window.goBack = goBack;
</script>
</body>
</html>
